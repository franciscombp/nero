<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nero · Editor de niveles</title>
<style>
  :root {
    --ink: #4A4139; --card: #FBF6EE; --accent: #E8967E; --bg: #F4ECE3;
    --line: rgba(74,65,57,.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Georgia, serif; background: var(--bg); color: var(--ink); }
  body { display: flex; flex-direction: column; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--card); border-bottom: 1.5px solid var(--line);
  }
  header .brand { font-size: 15px; letter-spacing: 2px; margin-right: 8px; }
  header .brand b { color: var(--accent); }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--line);
    background: transparent; font-size: 12.5px; cursor: pointer; font-family: inherit; color: var(--ink);
  }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .spacer { flex: 1; }
  .btn {
    padding: 6px 14px; border-radius: 999px; border: none; background: var(--ink); color: #fff;
    font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .btn.warm { background: var(--accent); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

  #palette {
    display: flex; gap: 4px; align-items: center; flex-wrap: wrap;
    padding: 6px 12px; background: var(--card); border-bottom: 1.5px solid var(--line);
  }
  #palette .lbl { font-size: 11.5px; opacity: .65; margin-right: 4px; }
  .kbtn {
    padding: 4px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff8;
    font-size: 11.5px; cursor: pointer; font-family: inherit; color: var(--ink);
  }
  .kbtn.on { outline: 2px solid var(--accent); }

  main { flex: 1; display: flex; min-height: 0; }
  #wrap { flex: 1; position: relative; min-width: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #cv.placing { cursor: crosshair; }

  aside {
    width: 330px; background: var(--card); border-left: 1.5px solid var(--line);
    overflow-y: auto; padding: 12px 14px 40px; font-size: 13px;
  }
  aside h3 { margin: 14px 0 8px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  aside label { display: block; margin: 7px 0 2px; font-size: 11.5px; opacity: .7; }
  aside input[type=text], aside input[type=number], aside select, aside textarea {
    width: 100%; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px;
    font-family: inherit; font-size: 12.5px; background: #fff; color: var(--ink);
  }
  aside textarea { min-height: 64px; resize: vertical; }
  aside .row { display: flex; gap: 8px; }
  aside .row > div { flex: 1; }
  aside .memcard {
    border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; background: #fff6;
  }
  aside .del { background: none; border: none; color: #C0604A; cursor: pointer; font-size: 11.5px; font-family: inherit; padding: 2px 0; }
  aside .warn { color: #C0604A; font-size: 12px; margin: 6px 0; }
  aside .ok { color: #6B8F5E; font-size: 12px; margin: 6px 0; }
  #banner {
    display: none; padding: 6px 12px; background: #F3C5B4; font-size: 12px; text-align: center;
  }
  #banner button { margin-left: 8px; }
  input[type=color] { width: 100%; height: 30px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; padding: 2px; }
  input[type=checkbox] { width: auto; }
</style>
</head>
<body>
<header>
  <span class="brand">🐈‍⬛ NERO · <b>editor</b></span>
  <div class="tabs" id="sceneTabs"></div>
  <button class="tab" id="addScene" title="Nueva escena">＋</button>
  <div class="spacer"></div>
  <button class="btn ghost" id="resetBtn" title="Descartar borrador y recargar del repo">↺ Original</button>
  <button class="btn ghost" id="exportBtn">💾 Exportar JSON</button>
  <button class="btn" id="play2d">▶ Probar 2D</button>
  <button class="btn warm" id="play3d">▶ Probar 3D</button>
</header>
<div id="banner">Estás editando un borrador local (se guarda automáticamente). Exporta el JSON y reemplaza <code>data/*.json</code> para publicarlo.
  <button class="btn ghost" id="dropDraft">Descartar borrador</button>
</div>
<div id="palette">
  <span class="lbl">Añadir mueble (clic y luego clic en el lienzo):</span>
</div>
<main>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <aside id="panel"></aside>
</main>
<script type="module" src="js/editor.js"></script>
</body>
</html>
