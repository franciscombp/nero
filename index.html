<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nero · Gato en casa</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EDE3D4; touch-action:none; -webkit-user-select:none; user-select:none; }
  #game { display:block; width:100vw; height:100dvh; }
  #ui {
    position:fixed; top:0; left:0; right:0; padding:12px 16px; display:flex;
    justify-content:space-between; align-items:center; pointer-events:none;
    font-family:Georgia, 'Times New Roman', serif; color:#3A342B;
  }
  #ui .pill {
    background:rgba(237,227,212,.85); border:2px solid #3A342B; border-radius:999px;
    padding:6px 14px; font-size:14px; letter-spacing:.5px;
  }
  #reset { pointer-events:auto; cursor:pointer; }
  #memory {
    position:fixed; left:50%; bottom:12dvh; transform:translateX(-50%) translateY(20px);
    max-width:min(80vw, 420px); background:#F6EFE2; border:2px solid #3A342B; border-radius:14px;
    padding:16px 20px; font-family:Georgia, serif; font-size:16px; line-height:1.5; color:#3A342B;
    box-shadow:0 6px 0 rgba(58,52,43,.25); opacity:0; transition:opacity .5s, transform .5s;
    pointer-events:none; text-align:center;
  }
  #memory.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #memory b { color:#C4623A; }
  #hint {
    position:fixed; left:50%; bottom:4dvh; transform:translateX(-50%);
    font-family:Georgia, serif; font-size:13px; color:#8A7C66; text-align:center;
    pointer-events:none; transition:opacity 1s;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="pill" id="progress">🐾 0 / 3 recuerdos</div>
  <div class="pill" id="reset">↺ reiniciar</div>
</div>
<div id="memory"></div>
<div id="hint">Desliza ↑ ↖ ↗ para saltar (largo = supersalto) · arrastra al lado para andar sigiloso<br>También: taps por zonas, dos dedos = supersalto · teclado: flechas + Shift</div>
<script>
'use strict';

// ---------- Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// Palette (boho / warm)
const C = {
  bg:      '#EDE3D4',
  bgDeep:  '#E4D6C0',
  ink:     '#2A251D',
  cat:     '#1E1B16',
  terra:   '#C4623A',
  mustard: '#D9982F',
  sand:    '#E0B98A',
  blush:   '#DFA88C',
  sage:    '#9BA37E',
  wood:    '#A9713F',
  woodDk:  '#8A5A30',
  cream:   '#F6EFE2',
  shadow:  'rgba(58,52,43,.18)'
};

// ---------- World ----------
// World coords: x grows right, y grows DOWN. Floor at y = 0 baseline (worldH).
const WORLD_W = 900;
const WORLD_H = 1750;           // tall kitchen wall, we climb upward
const FLOOR_Y = WORLD_H - 60;   // top surface of floor

// Platforms: {x, y (top surface), w, h, label}
const platforms = [
  { x: 0,   y: FLOOR_Y, w: WORLD_W, h: 60, kind:'floor' },
  { x: 90,  y: FLOOR_Y - 170, w: 150, h: 16, kind:'chair' },
  { x: 330, y: FLOOR_Y - 300, w: 300, h: 22, kind:'table' },
  { x: 700, y: FLOOR_Y - 430, w: 200, h: 26, kind:'counter' },
  { x: 480, y: FLOOR_Y - 590, w: 170, h: 14, kind:'shelf' },
  { x: 150, y: FLOOR_Y - 740, w: 190, h: 14, kind:'shelf' },
  { x: 470, y: FLOOR_Y - 910, w: 180, h: 14, kind:'shelf' },
  { x: 130, y: FLOOR_Y - 1080, w: 160, h: 14, kind:'shelf' },
  { x: 430, y: FLOOR_Y - 1250, w: 220, h: 18, kind:'top' },   // repisa alta con planta
  { x: 60,  y: FLOOR_Y - 1420, w: 250, h: 20, kind:'window' } // ventana = salida
];

// ---------- Cat ----------
const cat = {
  x: 140, y: FLOOR_Y, vx: 0, vy: 0,
  w: 44, h: 40,
  onGround: true, facing: 1,
  state: 'idle',        // idle | charge | air | hang | land | sneak
  stateT: 0, landAge: 99, combo: 0,
  squash: 1,            // vertical scale for liquid feel
  tailT: 0,
  hangPlat: null, hangSide: 1,
  landT: 0
};
const GRAV = 2400;
// jump heights: normal v²/2g ≈ 188px (clears the 170px chair gap), big ≈ 352px
const JUMP_VX = 360, JUMP_VY = 950, BIG_VY = 1300;

// ---------- Objects / narrative ----------
const memories = [
  { id:'taza',   text:'La taza favorita del abuelo. Nadie la usa desde hace años…<br><b>pero nadie se atreve a guardarla.</b>' },
  { id:'planta', text:'La monstera que mamá riega cada domingo.<br><b>«No la toques, Nero», dice siempre. Demasiado tarde.</b>' },
  { id:'foto',   text:'Detrás de la ventana, el patio donde jugaban los niños.<br><b>La casa entera cabe en esta luz de tarde.</b>' }
];
let found = {};

const mug = { x: 760, y: FLOOR_Y - 430, vx:0, vy:0, falling:false, broken:false, r:14, wob:0 };

let gameWon = false, winT = 0;

// ---------- Input ----------
const uiMemory = document.getElementById('memory');
const uiProgress = document.getElementById('progress');
const uiHint = document.getElementById('hint');
let hintShown = true;

function showMemory(html) {
  uiMemory.innerHTML = html;
  uiMemory.classList.add('show');
  clearTimeout(uiMemory._t);
  uiMemory._t = setTimeout(() => uiMemory.classList.remove('show'), 4200);
}
function updateProgress() {
  const n = Object.keys(found).length;
  uiProgress.textContent = `🐾 ${n} / ${memories.length} recuerdos`;
}
function collect(id) {
  if (found[id]) return;
  found[id] = true;
  updateProgress();
  showMemory(memories.find(m => m.id === id).text);
}

function doJump(dir, big) {
  if (cat.state === 'hang') {
    if (dir === -cat.hangSide) {
      // wall-jump combo: leap away from the ledge, higher and farther
      cat.state = 'air'; cat.onGround = false; cat.hangPlat = null;
      cat.vy = -BIG_VY * 0.85; cat.vx = dir * JUMP_VX * 1.35;
      cat.facing = dir; cat.squash = 1.3;
      return;
    }
    // climb up from hang
    cat.y = cat.hangPlat.y; cat.x += cat.hangSide * 20;
    cat.vy = -420; cat.vx = 0; cat.state = 'air'; cat.onGround = false; cat.hangPlat = null;
    return;
  }
  if (!cat.onGround) return;
  // bunny-hop combo: chaining jumps right after landing builds extra height
  if (cat.landAge < 0.22) cat.combo = Math.min(cat.combo + 1, 3);
  else cat.combo = 0;
  const boost = 1 + 0.12 * cat.combo;
  cat.onGround = false; cat.state = 'air';
  cat.vy = -(big ? BIG_VY : JUMP_VY) * boost;
  cat.vx = dir * JUMP_VX;
  if (dir !== 0) cat.facing = dir;
  cat.squash = 1.25 + 0.05 * cat.combo; // stretch more on combo takeoff
  if (hintShown) { hintShown = false; uiHint.style.opacity = 0; }
}

// touch: left / center / right thirds; two fingers OR long press = big jump;
// drag/swipe sideways = sneak-walk while the finger stays down
let pressT = null, pressZone = 0, pressStart = null;
let sneakTouchDir = 0;
const activePointers = new Set();
canvas.addEventListener('pointerdown', e => {
  activePointers.add(e.pointerId);
  if (activePointers.size >= 2) {
    // second finger: instant super jump in the direction of the first press
    doJump(pressZone, true);
    pressT = null;
    return;
  }
  const x = e.clientX;
  pressZone = x < W/3 ? -1 : (x > 2*W/3 ? 1 : 0);
  pressT = performance.now();
  pressStart = { x: e.clientX, y: e.clientY };
  if (cat.onGround && cat.state !== 'hang') { cat.state = 'charge'; cat.squash = 0.8; }
});
canvas.addEventListener('pointermove', e => {
  if (!pressStart || activePointers.size !== 1) return;
  const dx = e.clientX - pressStart.x, dy = e.clientY - pressStart.y;
  // clearly horizontal drag = sneak; anything upward is a jump swipe
  if (Math.abs(dx) > 22 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    sneakTouchDir = Math.sign(dx);
    pressT = null; // a drag is a sneak, not a tap-jump
    if (hintShown) { hintShown = false; uiHint.style.opacity = 0; }
  }
});
function releasePointer(e) {
  activePointers.delete(e.pointerId);
  const start = pressStart;
  if (activePointers.size === 0) { sneakTouchDir = 0; pressStart = null; }
  if (pressT === null) return;
  const heldMs = performance.now() - pressT;
  pressT = null;
  // swipe up / up-left / up-right = directional jump; long or fast = super jump
  if (start && e.clientX !== undefined) {
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (dy < -30) {
      const dir = dx > 36 ? 1 : dx < -36 ? -1 : 0;
      const big = -dy > 130 || (heldMs < 180 && -dy > 70); // long swipe or quick flick
      doJump(dir, big);
      return;
    }
  }
  // plain tap: zone jump (long press = super jump)
  doJump(pressZone, heldMs > 350);
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);

// keyboard: Shift + arrow = sneak-walk instead of jumping
const held = { left: false, right: false, shift: false };
window.addEventListener('keydown', e => {
  if (e.key === 'Shift') held.shift = true;
  if (e.key === 'ArrowLeft') held.left = true;
  if (e.key === 'ArrowRight') held.right = true;
  if (e.repeat) return;
  if (e.key === 'ArrowLeft') { if (!e.shiftKey) doJump(-1, false); }
  else if (e.key === 'ArrowRight') { if (!e.shiftKey) doJump(1, false); }
  else if (e.key === 'ArrowUp' || e.key === ' ') doJump(0, e.shiftKey);
  else if (e.key === 'r' || e.key === 'R') resetGame();
});
window.addEventListener('keyup', e => {
  if (e.key === 'Shift') held.shift = false;
  if (e.key === 'ArrowLeft') held.left = false;
  if (e.key === 'ArrowRight') held.right = false;
});
document.getElementById('reset').addEventListener('click', resetGame);

function resetGame() {
  cat.x = 140; cat.y = FLOOR_Y; cat.vx = 0; cat.vy = 0;
  cat.onGround = true; cat.state = 'idle'; cat.squash = 1; cat.hangPlat = null;
  mug.x = 760; mug.y = FLOOR_Y - 430; mug.vx = 0; mug.vy = 0; mug.falling = false; mug.broken = false;
  found = {}; gameWon = false; winT = 0;
  updateProgress();
  uiMemory.classList.remove('show');
}

// ---------- Physics ----------
function stepCat(dt) {
  if (cat.state === 'hang') { cat.tailT += dt; return; }

  const prevY = cat.y;
  cat.vy += GRAV * dt;
  cat.x += cat.vx * dt;
  cat.y += cat.vy * dt;
  cat.x = Math.max(cat.w/2, Math.min(WORLD_W - cat.w/2, cat.x));

  cat.onGround = false;
  for (const p of platforms) {
    // land on top: was above surface, now below, falling, horizontally overlapping
    if (cat.vy >= 0 && prevY <= p.y + 1 && cat.y >= p.y &&
        cat.x + cat.w*0.35 > p.x && cat.x - cat.w*0.35 < p.x + p.w) {
      cat.y = p.y; cat.vy = 0; cat.vx = 0;
      if (!cat.onGround) { cat.squash = 0.7; cat.state = 'land'; cat.landT = 0; cat.landAge = 0; }
      cat.onGround = true;
      break;
    }
    // ledge grab: airborne near a ledge's top edge (any horizontal motion)
    if (!cat.onGround && cat.vy > -80 && p.kind !== 'floor') {
      const front = cat.x + cat.w/2, back = cat.x - cat.w/2;
      const nearL = front > p.x - 26 && front < p.x + 14;
      const nearR = back < p.x + p.w + 26 && back > p.x + p.w - 14;
      if ((nearL || nearR) && cat.y > p.y + 4 && cat.y < p.y + 90) {
        cat.state = 'hang'; cat.hangPlat = p; cat.hangSide = nearL ? 1 : -1;
        cat.x = nearL ? p.x - cat.w*0.25 : p.x + p.w + cat.w*0.25;
        cat.y = p.y + 34; cat.vx = 0; cat.vy = 0;
        cat.facing = cat.hangSide;
        return;
      }
    }
  }

  if (cat.onGround) {
    cat.landAge += dt;
    if (cat.state === 'land') {
      cat.landT += dt;
      if (cat.landT > 0.18) cat.state = 'idle';
    } else if (cat.state !== 'charge') cat.state = 'idle';
  } else {
    cat.landAge = 99;
    if (cat.state !== 'charge') cat.state = 'air';
  }

  // sneak-walk: drag on touch, Shift+arrow on keyboard
  const sneakDir = sneakTouchDir || (held.shift ? (held.right ? 1 : 0) - (held.left ? 1 : 0) : 0);
  if (cat.onGround && sneakDir !== 0) {
    cat.x += sneakDir * 115 * dt;
    cat.x = Math.max(cat.w/2, Math.min(WORLD_W - cat.w/2, cat.x));
    cat.facing = sneakDir;
    cat.state = 'sneak';
    // walked past the edge? start falling
    const supported = platforms.some(p =>
      cat.y === p.y && cat.x + cat.w*0.35 > p.x && cat.x - cat.w*0.35 < p.x + p.w);
    if (!supported) { cat.onGround = false; cat.state = 'air'; }
  }

  // fell off world safety
  if (cat.y > WORLD_H + 200) { cat.x = 140; cat.y = FLOOR_Y; cat.vy = 0; cat.vx = 0; }

  // squash relaxes toward 1 (liquid feel)
  cat.squash += (1 - cat.squash) * Math.min(1, dt * 10);
  cat.tailT += dt;

  // interactions
  // mug: push it off the counter
  if (!mug.broken && !mug.falling &&
      Math.abs(cat.x - mug.x) < 40 && Math.abs(cat.y - mug.y) < 50) {
    mug.falling = true; mug.vx = (mug.x > cat.x ? 1 : -1) * 120; mug.vy = -80;
  }
  // plant on top shelf
  const top = platforms.find(p => p.kind === 'top');
  if (cat.onGround && cat.y === top.y && cat.x > top.x && cat.x < top.x + top.w) collect('planta');
  // window = final memory + win
  const win = platforms.find(p => p.kind === 'window');
  if (cat.onGround && cat.y === win.y && cat.x > win.x && cat.x < win.x + win.w) {
    collect('foto');
    if (!gameWon && Object.keys(found).length === memories.length) gameWon = true;
  }
}

function stepMug(dt) {
  if (!mug.falling || mug.broken) { mug.wob += dt; return; }
  mug.vy += GRAV * 0.8 * dt;
  mug.x += mug.vx * dt; mug.y += mug.vy * dt;
  if (mug.y >= FLOOR_Y - 4) {
    mug.y = FLOOR_Y - 4; mug.broken = true; mug.falling = false;
    collect('taza');
  }
}

// ---------- Camera ----------
const cam = { x: 0, y: 0, scale: 1 };
function stepCam(dt) {
  cam.scale = Math.max(W / WORLD_W, 0.8);
  const targetX = Math.max(0, Math.min(WORLD_W - W / cam.scale, cat.x - (W / cam.scale) / 2));
  const targetY = Math.max(0, Math.min(WORLD_H - H / cam.scale, cat.y - (H / cam.scale) * 0.62));
  cam.x += (targetX - cam.x) * Math.min(1, dt * 5);
  cam.y += (targetY - cam.y) * Math.min(1, dt * 4);
}

// ---------- Drawing ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function drawBackground() {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.scale(cam.scale, cam.scale);
  ctx.translate(-cam.x, -cam.y);

  // wall band
  ctx.fillStyle = C.bgDeep;
  ctx.fillRect(0, FLOOR_Y - 480, WORLD_W, 480);

  // sun (parallax-ish, fixed in world)
  ctx.fillStyle = C.cream;
  ctx.beginPath(); ctx.arc(160, FLOOR_Y - 1560, 70, 0, 7); ctx.fill();

  // boho arcs top-right
  const ax = 700, ay = FLOOR_Y - 1520;
  const arcs = [[110, C.blush], [88, C.mustard], [66, C.terra]];
  for (const [r, col] of arcs) {
    ctx.beginPath(); ctx.arc(ax, ay, r, Math.PI, 0);
    ctx.lineWidth = 20; ctx.strokeStyle = col; ctx.stroke();
  }

  // half-circle wall decor
  ctx.fillStyle = C.sand;
  ctx.beginPath(); ctx.arc(820, FLOOR_Y - 700, 60, Math.PI/2, -Math.PI/2); ctx.fill();
  ctx.fillStyle = C.blush;
  ctx.beginPath(); ctx.arc(40, FLOOR_Y - 950, 55, -Math.PI/2, Math.PI/2); ctx.fill();

  ctx.restore();
}

function drawPlatform(p) {
  if (p.kind === 'floor') {
    ctx.fillStyle = C.wood; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = C.woodDk; ctx.fillRect(p.x, p.y, p.w, 8);
    return;
  }
  if (p.kind === 'chair') {
    ctx.fillStyle = C.terra;
    rr(p.x, p.y, p.w, p.h, 6); ctx.fill();
    ctx.fillStyle = C.woodDk;
    ctx.fillRect(p.x + 14, p.y + p.h, 10, FLOOR_Y - p.y - p.h);
    ctx.fillRect(p.x + p.w - 24, p.y + p.h, 10, FLOOR_Y - p.y - p.h);
    return;
  }
  if (p.kind === 'table') {
    ctx.fillStyle = C.wood; rr(p.x, p.y, p.w, p.h, 8); ctx.fill();
    ctx.fillStyle = C.woodDk;
    ctx.fillRect(p.x + 20, p.y + p.h, 14, FLOOR_Y - p.y - p.h);
    ctx.fillRect(p.x + p.w - 34, p.y + p.h, 14, FLOOR_Y - p.y - p.h);
    // mantel
    ctx.fillStyle = C.cream; ctx.fillRect(p.x + 60, p.y - 2, 90, 6);
    return;
  }
  if (p.kind === 'counter') {
    ctx.fillStyle = C.sage; rr(p.x, p.y, p.w, p.h, 6); ctx.fill();
    ctx.fillStyle = C.woodDk; ctx.fillRect(p.x + 8, p.y + p.h, p.w - 16, FLOOR_Y - p.y - p.h);
    ctx.fillStyle = 'rgba(246,239,226,.25)';
    ctx.fillRect(p.x + 24, p.y + p.h + 20, 60, 90);
    return;
  }
  if (p.kind === 'window') {
    // window frame behind the sill
    ctx.fillStyle = C.cream; rr(p.x + 20, p.y - 190, p.w - 40, 180, 90); ctx.fill();
    ctx.strokeStyle = C.woodDk; ctx.lineWidth = 8;
    rr(p.x + 20, p.y - 190, p.w - 40, 180, 90); ctx.stroke();
    ctx.fillStyle = C.mustard;
    ctx.beginPath(); ctx.arc(p.x + p.w/2, p.y - 100, 34, 0, 7); ctx.fill();
    ctx.fillStyle = C.wood; rr(p.x, p.y, p.w, p.h, 4); ctx.fill();
    return;
  }
  // shelves / top
  ctx.fillStyle = p.kind === 'top' ? C.terra : C.wood;
  rr(p.x, p.y, p.w, p.h, 4); ctx.fill();
  ctx.fillStyle = C.shadow;
  ctx.fillRect(p.x + 6, p.y + p.h, p.w - 12, 6);
}

function drawPlant(x, baseY) {
  // vase (mustard, like reference)
  ctx.fillStyle = C.mustard;
  rr(x - 26, baseY - 78, 52, 78, 18); ctx.fill();
  // leaves
  ctx.fillStyle = C.cat;
  ctx.save(); ctx.translate(x, baseY - 78);
  for (const [ang, len] of [[-1.9, 70], [-2.4, 58], [-1.2, 66], [-0.7, 52], [-1.6, 84]]) {
    ctx.save(); ctx.rotate(ang + Math.sin(performance.now()/900 + len) * 0.03);
    ctx.beginPath(); ctx.ellipse(len * 0.6, 0, len * 0.55, 12, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawMug() {
  if (mug.broken) {
    ctx.fillStyle = C.terra;
    ctx.beginPath(); ctx.moveTo(mug.x - 16, mug.y);
    ctx.lineTo(mug.x - 6, mug.y - 10); ctx.lineTo(mug.x + 2, mug.y);
    ctx.lineTo(mug.x + 10, mug.y - 8); ctx.lineTo(mug.x + 18, mug.y);
    ctx.closePath(); ctx.fill();
    return;
  }
  const wob = mug.falling ? Math.sin(mug.wob * 20) * 0.4 : 0;
  ctx.save(); ctx.translate(mug.x, mug.y); ctx.rotate(wob);
  ctx.fillStyle = C.terra;
  rr(-mug.r, -mug.r * 1.6, mug.r * 2, mug.r * 1.6, 4); ctx.fill();
  ctx.strokeStyle = C.terra; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(mug.r + 4, -mug.r * 0.8, 7, -1.2, 1.2); ctx.stroke();
  ctx.restore();
}

function drawCat() {
  const t = cat.tailT;
  ctx.save();
  ctx.translate(cat.x, cat.y);

  // shadow
  ctx.fillStyle = C.shadow;
  ctx.beginPath(); ctx.ellipse(0, 2, cat.w * 0.55, 6, 0, 0, 7); ctx.fill();

  const sy = cat.squash, sx = 2 - cat.squash; // conserve "volume"
  ctx.scale(cat.facing * sx, sy);

  const air = cat.state === 'air';
  const hang = cat.state === 'hang';
  const sneak = cat.state === 'sneak';
  const sway = Math.sin(t * 2.2) * 8;

  ctx.fillStyle = C.cat;
  ctx.strokeStyle = C.cat;
  ctx.lineCap = 'round';

  let hx, hy, hr; // head center + radius, for eyes/ears
  if (hang) {
    // ---- hanging: paws hooked over the lip, body dangling, peeking up ----
    // ledge lip sits at y = -34 in local coords (see grab logic)
    hx = 10; hy = -22; hr = 13.5;
    // dangling tail, swinging
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(-4, -4);
    ctx.bezierCurveTo(-8, 12 + sway * 0.4, -22, 20 + sway * 0.8, -19, 4 + sway);
    ctx.stroke();
    // body: soft teardrop hanging from the forelegs
    ctx.beginPath();
    ctx.moveTo(15, -33);
    ctx.bezierCurveTo(23, -20, 19, -2, 6, 1);
    ctx.bezierCurveTo(-6, 4, -14, -7, -10, -21);
    ctx.bezierCurveTo(-8, -29, -2, -34, 5, -35);
    ctx.closePath(); ctx.fill();
    // forelegs stretched up and forward onto the ledge
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(23, -39); ctx.lineTo(14, -27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13, -41); ctx.lineTo(7, -29); ctx.stroke();
    // paws gripping clearly on top of the lip, ahead of the head
    ctx.beginPath(); ctx.arc(25, -40, 5.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(14, -42, 5.5, 0, 7); ctx.fill();
    // head below the paws, tilted up
    ctx.beginPath(); ctx.ellipse(hx, hy, hr, hr * 0.94, -0.12, 0, 7); ctx.fill();
  } else if (sneak) {
    // ---- sneaking: low, long, head forward, gentle prowl bob ----
    ctx.translate(0, Math.sin(t * 13) * 1.3);
    hx = 22; hy = -19; hr = 11;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-22, -10);
    ctx.bezierCurveTo(-36, -7 + sway * 0.4, -44, -16 + sway, -39, -27 + sway * 0.8);
    ctx.stroke();
    // low stretched body, back slightly arched
    ctx.beginPath();
    ctx.moveTo(-26, 0);
    ctx.bezierCurveTo(-30, -14, -18, -23, -2, -22);
    ctx.bezierCurveTo(8, -22, 14, -24, 18, -25);
    ctx.bezierCurveTo(20, -14, 16, -3, 8, 0);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-4, -10, 24, 10, 0.06, 0, 7); ctx.fill();
    // head low and forward
    ctx.beginPath(); ctx.ellipse(hx, hy, hr, hr * 0.9, 0.12, 0, 7); ctx.fill();
  } else if (air) {
    // ---- airborne: stretched arc, head leading, hindquarters trailing ----
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(-14, -12);
    ctx.bezierCurveTo(-38, -4 + sway, -52, -28 + sway, -44, -52 - sway * 0.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(-4, -cat.h * 0.4, cat.w * 0.42, cat.h * 0.38, -0.28, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(6, -cat.h * 0.62, cat.w * 0.33, cat.h * 0.4, -0.1, 0, 7);
    ctx.fill();
    hx = cat.w * 0.22; hy = -cat.h * 0.95; hr = cat.w * 0.29;
    ctx.beginPath(); ctx.ellipse(hx, hy, hr, hr * 0.95, -0.1, 0, 7); ctx.fill();
  } else {
    // ---- sitting: organic silhouette, S-curved back, asymmetric rump ----
    hx = 3; hy = -59; hr = 15;
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(-4, -4);
    ctx.bezierCurveTo(-32, 4, -48, -6 + sway * 0.4, -44, -34 + sway);
    ctx.bezierCurveTo(-41, -54 + sway, -30, -60 + sway, -25, -51 + sway * 0.7);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-22, 0);                                  // base left, flared
    ctx.bezierCurveTo(-27, -13, -23, -27, -13, -38);     // round rump
    ctx.bezierCurveTo(-9, -43, -10, -50, -8, -55);       // waist dips in (S-curve)
    ctx.bezierCurveTo(-7, -71, 13, -72, 14, -57);        // crown, slightly tilted
    ctx.bezierCurveTo(15, -51, 12, -46, 14, -40);        // jaw into neck
    ctx.bezierCurveTo(19, -29, 21, -14, 18, 0);          // chest slope, narrower base
    ctx.closePath(); ctx.fill();
    // haunch, tilted so the mass reads organic rather than circular
    ctx.beginPath(); ctx.ellipse(-4, -12, 19, 13, -0.1, 0, 7); ctx.fill();
    // front paw hint
    ctx.beginPath(); ctx.ellipse(9, -2, 8, 4, 0, 0, 7); ctx.fill();
  }

  // ---- ears: tall, pointed, slightly flared (reference) ----
  const flat = air ? 6 : 0; // ears back a touch mid-air
  ctx.beginPath();
  ctx.moveTo(hx - hr * 0.75, hy - hr * 0.45);
  ctx.quadraticCurveTo(hx - hr * 1.15, hy - hr * 1.6 + flat, hx - hr * 0.85, hy - hr * 2.1 + flat);
  ctx.quadraticCurveTo(hx - hr * 0.35, hy - hr * 1.35, hx - hr * 0.1, hy - hr * 0.9);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx + hr * 0.85, hy - hr * 0.45);
  ctx.quadraticCurveTo(hx + hr * 1.25, hy - hr * 1.6 + flat, hx + hr * 0.95, hy - hr * 2.1 + flat);
  ctx.quadraticCurveTo(hx + hr * 0.45, hy - hr * 1.35, hx + hr * 0.2, hy - hr * 0.9);
  ctx.closePath(); ctx.fill();

  // ---- eyes: big round white rings, almost touching (reference) ----
  const blink = (Math.sin(t * 0.7) > 0.995) ? 0.12 : 1;
  const er = hr * 0.36;
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.ellipse(hx - hr * 0.5, hy + hr * 0.14, er, er * blink, 0, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(hx + hr * 0.55, hy + hr * 0.14, er, er * blink, 0, 0, 7); ctx.stroke();

  ctx.restore();
}

function drawWin() {
  winT += 1/60;
  ctx.fillStyle = 'rgba(42,37,29,' + Math.min(0.75, winT * 0.4) + ')';
  ctx.fillRect(0, 0, W, H);
  if (winT > 0.8) {
    ctx.fillStyle = C.cream;
    ctx.font = '28px Georgia, serif'; ctx.textAlign = 'center';
    ctx.fillText('Nero conoce esta casa de memoria.', W/2, H/2 - 20);
    ctx.font = '17px Georgia, serif';
    ctx.fillStyle = C.sand;
    ctx.fillText('Encontraste los 3 recuerdos · toca ↺ para volver a jugar', W/2, H/2 + 20);
  }
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;

  if (!gameWon) {
    stepCat(dt);
    stepMug(dt);
  }
  stepCam(dt);

  drawBackground();
  ctx.save();
  ctx.scale(cam.scale, cam.scale);
  ctx.translate(-cam.x, -cam.y);

  for (const p of platforms) drawPlatform(p);
  const top = platforms.find(p => p.kind === 'top');
  drawPlant(top.x + top.w - 55, top.y);
  drawMug();
  drawCat();

  ctx.restore();

  if (gameWon) drawWin();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
