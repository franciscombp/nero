<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nero · Gato en casa</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EDE3D4; touch-action:none; -webkit-user-select:none; user-select:none; }
  #game { display:block; width:100vw; height:100dvh; }
  #ui {
    position:fixed; top:0; left:0; right:0; padding:12px 16px; display:flex;
    justify-content:space-between; align-items:center; pointer-events:none;
    font-family:Georgia, 'Times New Roman', serif; color:#3A342B;
  }
  #ui .pill {
    background:rgba(237,227,212,.85); border:2px solid #3A342B; border-radius:999px;
    padding:6px 14px; font-size:14px; letter-spacing:.5px;
  }
  #reset { pointer-events:auto; cursor:pointer; }
  #memory {
    position:fixed; left:50%; bottom:12dvh; transform:translateX(-50%) translateY(20px);
    max-width:min(80vw, 420px); background:#F6EFE2; border:2px solid #3A342B; border-radius:14px;
    padding:16px 20px; font-family:Georgia, serif; font-size:16px; line-height:1.5; color:#3A342B;
    box-shadow:0 6px 0 rgba(58,52,43,.25); opacity:0; transition:opacity .5s, transform .5s;
    pointer-events:none; text-align:center;
  }
  #memory.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #memory b { color:#C4623A; }
  #hint {
    position:fixed; left:50%; bottom:4dvh; transform:translateX(-50%);
    font-family:Georgia, serif; font-size:13px; color:#8A7C66; text-align:center;
    pointer-events:none; transition:opacity 1s;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="pill" id="progress">🐾 0 / 3 recuerdos</div>
  <div class="pill" id="reset">↺ reiniciar</div>
</div>
<div id="memory"></div>
<div id="hint">Desliza ↑ ↖ ↗ para saltar (largo = supersalto) · ↓ para bajar<br>Toca un mueble para saltar hacia él · arrastra al lado = sigiloso</div>
<script>
'use strict';

// ---------- Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// Palette (boho / warm)
const C = {
  bg:      '#EDE3D4',
  bgDeep:  '#E4D6C0',
  ink:     '#2A251D',
  cat:     '#1E1B16',
  terra:   '#C4623A',
  mustard: '#D9982F',
  sand:    '#E0B98A',
  blush:   '#DFA88C',
  sage:    '#9BA37E',
  wood:    '#A9713F',
  woodDk:  '#8A5A30',
  cream:   '#F6EFE2',
  shadow:  'rgba(58,52,43,.18)'
};

// ---------- World ----------
// World coords: x grows right, y grows DOWN. Floor at y = 0 baseline (worldH).
const WORLD_W = 900;
const WORLD_H = 1750;           // tall kitchen wall, we climb upward
const FLOOR_Y = WORLD_H - 60;   // top surface of floor

// Platforms: {x, y (top surface), w, h, label}
const platforms = [
  { x: 0,   y: FLOOR_Y, w: WORLD_W, h: 60, kind:'floor' },
  { x: 90,  y: FLOOR_Y - 145, w: 150, h: 16, kind:'chair' },
  { x: 330, y: FLOOR_Y - 290, w: 300, h: 22, kind:'table' },
  { x: 700, y: FLOOR_Y - 430, w: 200, h: 26, kind:'counter' },
  { x: 480, y: FLOOR_Y - 580, w: 170, h: 14, kind:'shelf' },
  { x: 150, y: FLOOR_Y - 730, w: 190, h: 14, kind:'shelf' },
  { x: 470, y: FLOOR_Y - 880, w: 180, h: 14, kind:'shelf' },
  { x: 130, y: FLOOR_Y - 1030, w: 160, h: 14, kind:'shelf' },
  { x: 430, y: FLOOR_Y - 1190, w: 220, h: 18, kind:'top' },   // repisa alta con planta
  { x: 60,  y: FLOOR_Y - 1350, w: 250, h: 20, kind:'window' } // ventana = salida
];

// ---------- Cat ----------
const cat = {
  x: 140, y: FLOOR_Y, vx: 0, vy: 0,
  w: 44, h: 40,
  onGround: true, facing: 1,
  state: 'idle',        // idle | charge | air | hang | land | sneak
  stateT: 0, landAge: 99, combo: 0,
  squash: 1,            // vertical scale for liquid feel
  tailT: 0,
  hangPlat: null, hangSide: 1,
  landT: 0
};
const GRAV = 2400;
// jump heights: normal v²/2g ≈ 161px, big ≈ 276px — platform gaps are 130-160px
const JUMP_VX = 330, JUMP_VY = 880, BIG_VY = 1150;
const CEILING_Y = 80;

// ---------- Objects / narrative ----------
const memories = [
  { id:'taza',   text:'La taza favorita del abuelo. Nadie la usa desde hace años…<br><b>pero nadie se atreve a guardarla.</b>' },
  { id:'planta', text:'La monstera que mamá riega cada domingo.<br><b>«No la toques, Nero», dice siempre. Demasiado tarde.</b>' },
  { id:'foto',   text:'Detrás de la ventana, el patio donde jugaban los niños.<br><b>La casa entera cabe en esta luz de tarde.</b>' }
];
let found = {};

const mug = { x: 760, y: FLOOR_Y - 430, vx:0, vy:0, falling:false, broken:false, r:14, wob:0 };

// yarn ball on the floor: rolls away when the cat bumps it
const yarn = { x: 580, y: FLOOR_Y - 12, r: 12, vx: 0, rot: 0 };
// books standing on the second shelf: nudge them off for fun
const BOOK_SHELF = 5; // platforms index
const books = [
  { ox: 190, w: 13, h: 36, c: '#C4623A', down: false, x: 0, y: 0, vx: 0, vy: 0, rot: 0, rest: false },
  { ox: 208, w: 11, h: 30, c: '#9BA37E', down: false, x: 0, y: 0, vx: 0, vy: 0, rot: 0, rest: false },
  { ox: 224, w: 13, h: 33, c: '#D9982F', down: false, x: 0, y: 0, vx: 0, vy: 0, rot: 0, rest: false }
];

function stepProps(dt) {
  // yarn rolls when bumped, with friction and wall bounces
  if (Math.abs(cat.y - FLOOR_Y) < 40 && Math.abs(cat.x - yarn.x) < 40) {
    yarn.vx = (yarn.x > cat.x ? 1 : -1) * 240;
  }
  yarn.x += yarn.vx * dt;
  yarn.rot += yarn.vx * dt / yarn.r;
  yarn.vx *= Math.pow(0.35, dt);
  if (yarn.x < yarn.r + 6)          { yarn.x = yarn.r + 6; yarn.vx *= -0.6; }
  if (yarn.x > WORLD_W - yarn.r - 6){ yarn.x = WORLD_W - yarn.r - 6; yarn.vx *= -0.6; }

  // books topple off their shelf when the cat walks into them
  const shelf = platforms[BOOK_SHELF];
  for (const b of books) {
    if (!b.down) {
      const bx = shelf.x + b.ox;
      if (cat.y === shelf.y && Math.abs(cat.x - bx) < 28) {
        b.down = true;
        b.x = bx; b.y = shelf.y;
        b.vx = (bx > cat.x ? 1 : -1) * 90; b.vy = -60;
      }
    } else if (!b.rest) {
      b.vy += GRAV * 0.8 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.rot += b.vx * 0.02 * dt * 60;
      if (b.y >= FLOOR_Y - 4) { b.y = FLOOR_Y - 4; b.rest = true; b.rot = (b.vx > 0 ? 1 : -1) * 1.5; }
    }
  }
}

let gameWon = false, winT = 0;

// ---------- Input ----------
const uiMemory = document.getElementById('memory');
const uiProgress = document.getElementById('progress');
const uiHint = document.getElementById('hint');
let hintShown = true;

function showMemory(html) {
  uiMemory.innerHTML = html;
  uiMemory.classList.add('show');
  clearTimeout(uiMemory._t);
  uiMemory._t = setTimeout(() => uiMemory.classList.remove('show'), 4200);
}
function updateProgress() {
  const n = Object.keys(found).length;
  uiProgress.textContent = `🐾 ${n} / ${memories.length} recuerdos`;
}
function collect(id) {
  if (found[id]) return;
  found[id] = true;
  updateProgress();
  showMemory(memories.find(m => m.id === id).text);
}

// targeted jump: aim a ballistic arc at a platform top near the tapped point.
// Returns false when the spot is out of reach so the caller can fall back.
function tryTargetJump(wx, wy) {
  if (!cat.onGround) return false;
  let best = null;
  for (const p of platforms) {
    if (Math.abs(p.y - wy) > 70) continue;
    const tx = Math.max(p.x + 14, Math.min(p.x + p.w - 14, wx));
    if (Math.abs(tx - wx) > 70) continue;
    if (p.y === cat.y && Math.abs(tx - cat.x) < 30) continue; // already there
    const d = Math.hypot(tx - cat.x, p.y - cat.y);
    if (!best || d < best.d) best = { tx, ty: p.y, d };
  }
  if (!best) return false;
  const rise = Math.max(cat.y - best.ty, 0) + 40;      // apex 40px above the target
  const vy = -Math.sqrt(2 * GRAV * rise);
  if (-vy > BIG_VY * 1.2) return false;                // too high even for a super jump
  const disc = vy * vy + 2 * GRAV * (best.ty - cat.y);
  if (disc < 0) return false;
  const t = (-vy + Math.sqrt(disc)) / GRAV;            // time to descend onto the target
  const vx = (best.tx - cat.x) / t;
  if (Math.abs(vx) > 430) return false;                // too far sideways
  cat.onGround = false; cat.state = 'air';
  cat.vy = vy; cat.vx = vx;
  if (Math.abs(vx) > 20) cat.facing = Math.sign(vx);
  cat.squash = 1.25;
  if (hintShown) { hintShown = false; uiHint.style.opacity = 0; }
  return true;
}

// drop down: fall through the platform under the cat (or fast-fall mid-air)
function doDrop() {
  if (cat.state === 'hang') { cat.state = 'air'; cat.hangPlat = null; cat.vy = 100; return; }
  if (cat.onGround) {
    const p = platforms.find(p => cat.y === p.y);
    if (!p || p.kind === 'floor') return;
    cat.y += 3; cat.vy = 180; cat.onGround = false; cat.state = 'air';
    cat.squash = 1.15;
  } else {
    cat.vy += 500; // fast-fall
  }
}

function doJump(dir, big) {
  if (cat.state === 'slide' && !cat.onGround) {
    // wall-jump off a side wall, always away from it
    const away = -cat.slideSide;
    cat.vx = away * JUMP_VX * 1.2; cat.vy = -JUMP_VY;
    cat.facing = away; cat.state = 'air'; cat.squash = 1.25;
    return;
  }
  if (cat.state === 'hang') {
    if (dir === -cat.hangSide) {
      // wall-jump combo: leap away from the ledge, higher and farther
      cat.state = 'air'; cat.onGround = false; cat.hangPlat = null;
      cat.vy = -BIG_VY * 0.85; cat.vx = dir * JUMP_VX * 1.35;
      cat.facing = dir; cat.squash = 1.3;
      return;
    }
    // climb up from hang
    cat.y = cat.hangPlat.y; cat.x += cat.hangSide * 20;
    cat.vy = -420; cat.vx = 0; cat.state = 'air'; cat.onGround = false; cat.hangPlat = null;
    return;
  }
  if (!cat.onGround) return;
  // bunny-hop combo: chaining jumps right after landing builds extra height
  if (cat.landAge < 0.22) cat.combo = Math.min(cat.combo + 1, 3);
  else cat.combo = 0;
  const boost = 1 + 0.12 * cat.combo;
  cat.onGround = false; cat.state = 'air';
  cat.vy = -(big ? BIG_VY : JUMP_VY) * boost;
  cat.vx = dir * JUMP_VX;
  if (dir !== 0) cat.facing = dir;
  cat.squash = 1.25 + 0.05 * cat.combo; // stretch more on combo takeoff
  if (hintShown) { hintShown = false; uiHint.style.opacity = 0; }
}

// touch: left / center / right thirds; two fingers OR long press = big jump;
// drag/swipe sideways = sneak-walk while the finger stays down
let pressT = null, pressZone = 0, pressStart = null;
let sneakTouchDir = 0;
const activePointers = new Set();
canvas.addEventListener('pointerdown', e => {
  activePointers.add(e.pointerId);
  if (activePointers.size >= 2) {
    // second finger: instant super jump in the direction of the first press
    doJump(pressZone, true);
    pressT = null;
    return;
  }
  const x = e.clientX;
  pressZone = x < W/3 ? -1 : (x > 2*W/3 ? 1 : 0);
  pressT = performance.now();
  pressStart = { x: e.clientX, y: e.clientY };
  if (cat.onGround && cat.state !== 'hang') { cat.state = 'charge'; cat.squash = 0.8; }
});
canvas.addEventListener('pointermove', e => {
  if (!pressStart || activePointers.size !== 1) return;
  const dx = e.clientX - pressStart.x, dy = e.clientY - pressStart.y;
  // clearly horizontal drag = sneak; anything upward is a jump swipe
  if (Math.abs(dx) > 22 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    sneakTouchDir = Math.sign(dx);
    pressT = null; // a drag is a sneak, not a tap-jump
    if (hintShown) { hintShown = false; uiHint.style.opacity = 0; }
  }
});
function releasePointer(e) {
  activePointers.delete(e.pointerId);
  const start = pressStart;
  if (activePointers.size === 0) { sneakTouchDir = 0; pressStart = null; }
  if (pressT === null) return;
  const heldMs = performance.now() - pressT;
  pressT = null;
  // swipe up / up-left / up-right = directional jump; long or fast = super jump
  if (start && e.clientX !== undefined) {
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (dy < -30) {
      const dir = dx > 36 ? 1 : dx < -36 ? -1 : 0;
      const big = -dy > 130 || (heldMs < 180 && -dy > 70); // long swipe or quick flick
      doJump(dir, big);
      return;
    }
    if (dy > 30 && Math.abs(dy) > Math.abs(dx)) { // swipe down = drop / fast-fall
      doDrop();
      return;
    }
  }
  // plain tap: try a targeted jump to the tapped spot, else hop toward it
  const wx = cam.x + e.clientX / cam.scale, wy = cam.y + e.clientY / cam.scale;
  if (!tryTargetJump(wx, wy)) {
    const dir = Math.abs(wx - cat.x) > 40 ? Math.sign(wx - cat.x) : 0;
    doJump(dir, heldMs > 350);
  }
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);

// keyboard: Shift + arrow = sneak-walk instead of jumping
const held = { left: false, right: false, shift: false };
window.addEventListener('keydown', e => {
  if (e.key === 'Shift') held.shift = true;
  if (e.key === 'ArrowLeft') held.left = true;
  if (e.key === 'ArrowRight') held.right = true;
  if (e.repeat) return;
  if (e.key === 'ArrowLeft') { if (!e.shiftKey) doJump(-1, false); }
  else if (e.key === 'ArrowRight') { if (!e.shiftKey) doJump(1, false); }
  else if (e.key === 'ArrowUp' || e.key === ' ') doJump(0, e.shiftKey);
  else if (e.key === 'ArrowDown') doDrop();
  else if (e.key === 'r' || e.key === 'R') resetGame();
});
window.addEventListener('keyup', e => {
  if (e.key === 'Shift') held.shift = false;
  if (e.key === 'ArrowLeft') held.left = false;
  if (e.key === 'ArrowRight') held.right = false;
});
document.getElementById('reset').addEventListener('click', resetGame);

function resetGame() {
  cat.x = 140; cat.y = FLOOR_Y; cat.vx = 0; cat.vy = 0;
  cat.onGround = true; cat.state = 'idle'; cat.squash = 1; cat.hangPlat = null;
  mug.x = 760; mug.y = FLOOR_Y - 430; mug.vx = 0; mug.vy = 0; mug.falling = false; mug.broken = false;
  yarn.x = 580; yarn.vx = 0; yarn.rot = 0;
  for (const b of books) { b.down = false; b.rest = false; b.rot = 0; b.vx = 0; b.vy = 0; }
  found = {}; gameWon = false; winT = 0;
  updateProgress();
  uiMemory.classList.remove('show');
}

// ---------- Physics ----------
function stepCat(dt) {
  if (cat.state === 'hang') { cat.tailT += dt; return; }

  const prevY = cat.y;
  cat.vy += GRAV * dt;
  cat.x += cat.vx * dt;
  cat.y += cat.vy * dt;
  cat.x = Math.max(cat.w/2, Math.min(WORLD_W - cat.w/2, cat.x));

  const wasGrounded = cat.onGround;
  cat.onGround = false;
  for (const p of platforms) {
    // land on top: was above surface, now below, falling, horizontally overlapping
    if (cat.vy >= 0 && prevY <= p.y + 1 && cat.y >= p.y &&
        cat.x + cat.w*0.35 > p.x && cat.x - cat.w*0.35 < p.x + p.w) {
      cat.y = p.y; cat.vy = 0; cat.vx = 0;
      // landing effects only on the air -> ground transition
      if (!wasGrounded) { cat.squash = 0.7; cat.state = 'land'; cat.landT = 0; cat.landAge = 0; }
      cat.onGround = true;
      break;
    }
    // ledge grab: airborne near a ledge's top edge (any horizontal motion)
    if (!cat.onGround && cat.vy > -80 && p.kind !== 'floor') {
      const front = cat.x + cat.w/2, back = cat.x - cat.w/2;
      const nearL = front > p.x - 26 && front < p.x + 14;
      const nearR = back < p.x + p.w + 26 && back > p.x + p.w - 14;
      if ((nearL || nearR) && cat.y > p.y + 4 && cat.y < p.y + 90) {
        cat.state = 'hang'; cat.hangPlat = p; cat.hangSide = nearL ? 1 : -1;
        cat.x = nearL ? p.x - cat.w*0.25 : p.x + p.w + cat.w*0.25;
        cat.y = p.y + 34; cat.vx = 0; cat.vy = 0;
        cat.facing = cat.hangSide;
        return;
      }
    }
  }

  if (cat.onGround) {
    cat.landAge += dt;
    if (cat.state === 'land') {
      cat.landT += dt;
      if (cat.landT > 0.18) cat.state = 'idle';
    } else if (cat.state !== 'charge') cat.state = 'idle';
  } else {
    cat.landAge = 99;
    if (cat.state !== 'charge') cat.state = 'air';
  }

  // wall cling: airborne against a side wall -> grab on and slide down slowly
  if (!cat.onGround && cat.state !== 'hang') {
    const atL = cat.x <= cat.w/2 + 1, atR = cat.x >= WORLD_W - cat.w/2 - 1;
    if ((atL || atR) && cat.vy > -100) {
      cat.state = 'slide';
      cat.slideSide = atL ? -1 : 1;
      cat.facing = cat.slideSide;          // face the wall
      if (cat.vy > 120) cat.vy = 120;      // claws scrape: slow controlled slide
    }
  }

  // ceiling: the room has a lid
  if (cat.y - cat.h < CEILING_Y) {
    cat.y = CEILING_Y + cat.h;
    if (cat.vy < 0) cat.vy = 0;
  }

  // sneak-walk: drag on touch, Shift+arrow on keyboard
  const sneakDir = sneakTouchDir || (held.shift ? (held.right ? 1 : 0) - (held.left ? 1 : 0) : 0);
  if (cat.onGround && sneakDir !== 0) {
    cat.x += sneakDir * 115 * dt;
    cat.x = Math.max(cat.w/2, Math.min(WORLD_W - cat.w/2, cat.x));
    cat.facing = sneakDir;
    cat.state = 'sneak';
    // walked past the edge? start falling
    const supported = platforms.some(p =>
      cat.y === p.y && cat.x + cat.w*0.35 > p.x && cat.x - cat.w*0.35 < p.x + p.w);
    if (!supported) { cat.onGround = false; cat.state = 'air'; }
  }

  // fell off world safety
  if (cat.y > WORLD_H + 200) { cat.x = 140; cat.y = FLOOR_Y; cat.vy = 0; cat.vx = 0; }

  // squash relaxes toward 1 (liquid feel)
  cat.squash += (1 - cat.squash) * Math.min(1, dt * 10);
  cat.tailT += dt;

  // interactions
  // mug: push it off the counter
  if (!mug.broken && !mug.falling &&
      Math.abs(cat.x - mug.x) < 40 && Math.abs(cat.y - mug.y) < 50) {
    mug.falling = true; mug.vx = (mug.x > cat.x ? 1 : -1) * 120; mug.vy = -80;
  }
  // plant on top shelf
  const top = platforms.find(p => p.kind === 'top');
  if (cat.onGround && cat.y === top.y && cat.x > top.x && cat.x < top.x + top.w) collect('planta');
  // window = final memory + win
  const win = platforms.find(p => p.kind === 'window');
  if (cat.onGround && cat.y === win.y && cat.x > win.x && cat.x < win.x + win.w) {
    collect('foto');
    if (!gameWon && Object.keys(found).length === memories.length) gameWon = true;
  }
}

function stepMug(dt) {
  if (!mug.falling || mug.broken) { mug.wob += dt; return; }
  mug.vy += GRAV * 0.8 * dt;
  mug.x += mug.vx * dt; mug.y += mug.vy * dt;
  if (mug.y >= FLOOR_Y - 4) {
    mug.y = FLOOR_Y - 4; mug.broken = true; mug.falling = false;
    collect('taza');
  }
}

// ---------- Camera ----------
const cam = { x: 0, y: 0, scale: 1 };
function stepCam(dt) {
  cam.scale = Math.max(W / WORLD_W, 0.8);
  const targetX = Math.max(0, Math.min(WORLD_W - W / cam.scale, cat.x - (W / cam.scale) / 2));
  const targetY = Math.max(0, Math.min(WORLD_H - H / cam.scale, cat.y - (H / cam.scale) * 0.62));
  cam.x += (targetX - cam.x) * Math.min(1, dt * 5);
  cam.y += (targetY - cam.y) * Math.min(1, dt * 4);
}

// ---------- Drawing ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function drawBackground() {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.scale(cam.scale, cam.scale);
  ctx.translate(-cam.x, -cam.y);

  // wall band
  ctx.fillStyle = C.bgDeep;
  ctx.fillRect(0, FLOOR_Y - 480, WORLD_W, 480);

  // sun (parallax-ish, fixed in world)
  ctx.fillStyle = C.cream;
  ctx.beginPath(); ctx.arc(160, FLOOR_Y - 1560, 70, 0, 7); ctx.fill();

  // boho arcs top-right
  const ax = 700, ay = FLOOR_Y - 1520;
  const arcs = [[110, C.blush], [88, C.mustard], [66, C.terra]];
  for (const [r, col] of arcs) {
    ctx.beginPath(); ctx.arc(ax, ay, r, Math.PI, 0);
    ctx.lineWidth = 20; ctx.strokeStyle = col; ctx.stroke();
  }

  // half-circle wall decor
  ctx.fillStyle = C.sand;
  ctx.beginPath(); ctx.arc(820, FLOOR_Y - 700, 60, Math.PI/2, -Math.PI/2); ctx.fill();
  ctx.fillStyle = C.blush;
  ctx.beginPath(); ctx.arc(40, FLOOR_Y - 950, 55, -Math.PI/2, Math.PI/2); ctx.fill();

  // ceiling lid
  ctx.fillStyle = C.woodDk;
  ctx.fillRect(0, CEILING_Y - 26, WORLD_W, 26);
  ctx.fillStyle = C.terra;
  ctx.fillRect(0, CEILING_Y - 4, WORLD_W, 8);

  // rug under the table
  ctx.fillStyle = C.terra;
  ctx.beginPath(); ctx.ellipse(450, FLOOR_Y + 8, 160, 18, 0, 0, 7); ctx.fill();
  ctx.fillStyle = C.cream;
  ctx.beginPath(); ctx.ellipse(450, FLOOR_Y + 8, 120, 13, 0, 0, 7); ctx.fill();
  ctx.fillStyle = C.mustard;
  ctx.beginPath(); ctx.ellipse(450, FLOOR_Y + 8, 78, 9, 0, 0, 7); ctx.fill();

  // picture frames on the wall
  const frame = (x, y, w, h, col) => {
    ctx.fillStyle = C.woodDk; ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
    ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
  };
  frame(600, FLOOR_Y - 720, 60, 78, C.blush);   // retrato
  ctx.fillStyle = C.cat;
  ctx.beginPath(); ctx.arc(630, FLOOR_Y - 672, 14, 0, 7); ctx.fill(); // gato del retrato
  ctx.beginPath(); ctx.ellipse(630, FLOOR_Y - 654, 17, 10, 0, 0, 7); ctx.fill();
  frame(310, FLOOR_Y - 1120, 70, 52, C.sage);   // paisaje
  ctx.fillStyle = C.mustard;
  ctx.beginPath(); ctx.arc(345, FLOOR_Y - 1098, 10, 0, 7); ctx.fill();

  ctx.restore();
}

function drawProps() {
  // yarn ball
  ctx.save();
  ctx.translate(yarn.x, yarn.y); ctx.rotate(yarn.rot);
  ctx.fillStyle = C.mustard;
  ctx.beginPath(); ctx.arc(0, 0, yarn.r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(138,90,48,.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, yarn.r * 0.72, 0.4, 2.6); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, yarn.r * 0.72, 3.3, 5.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-yarn.r * 0.8, -yarn.r * 0.3);
  ctx.quadraticCurveTo(0, yarn.r * 0.9, yarn.r * 0.8, yarn.r * 0.2); ctx.stroke();
  ctx.restore();
  // loose thread when it has rolled
  if (Math.abs(yarn.rot) > 0.5) {
    ctx.strokeStyle = C.mustard; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(yarn.x - yarn.r, FLOOR_Y - 2);
    ctx.quadraticCurveTo(yarn.x - 30, FLOOR_Y - 8, yarn.x - 52, FLOOR_Y - 2);
    ctx.stroke();
  }

  // books
  const shelf = platforms[BOOK_SHELF];
  for (const b of books) {
    ctx.save();
    if (!b.down) {
      ctx.translate(shelf.x + b.ox, shelf.y);
      ctx.rotate(Math.sin(cat.tailT * 1.3 + b.ox) * 0.02);
    } else {
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
    }
    ctx.fillStyle = b.c;
    ctx.fillRect(-b.w/2, -b.h, b.w, b.h);
    ctx.fillStyle = 'rgba(246,239,226,.8)';
    ctx.fillRect(-b.w/2, -b.h, b.w, 4);
    ctx.restore();
  }
}

function drawPlatform(p) {
  if (p.kind === 'floor') {
    ctx.fillStyle = C.wood; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = C.woodDk; ctx.fillRect(p.x, p.y, p.w, 8);
    return;
  }
  if (p.kind === 'chair') {
    ctx.fillStyle = C.terra;
    rr(p.x, p.y, p.w, p.h, 6); ctx.fill();
    ctx.fillStyle = C.woodDk;
    ctx.fillRect(p.x + 14, p.y + p.h, 10, FLOOR_Y - p.y - p.h);
    ctx.fillRect(p.x + p.w - 24, p.y + p.h, 10, FLOOR_Y - p.y - p.h);
    return;
  }
  if (p.kind === 'table') {
    ctx.fillStyle = C.wood; rr(p.x, p.y, p.w, p.h, 8); ctx.fill();
    ctx.fillStyle = C.woodDk;
    ctx.fillRect(p.x + 20, p.y + p.h, 14, FLOOR_Y - p.y - p.h);
    ctx.fillRect(p.x + p.w - 34, p.y + p.h, 14, FLOOR_Y - p.y - p.h);
    // mantel
    ctx.fillStyle = C.cream; ctx.fillRect(p.x + 60, p.y - 2, 90, 6);
    return;
  }
  if (p.kind === 'counter') {
    ctx.fillStyle = C.sage; rr(p.x, p.y, p.w, p.h, 6); ctx.fill();
    ctx.fillStyle = C.woodDk; ctx.fillRect(p.x + 8, p.y + p.h, p.w - 16, FLOOR_Y - p.y - p.h);
    ctx.fillStyle = 'rgba(246,239,226,.25)';
    ctx.fillRect(p.x + 24, p.y + p.h + 20, 60, 90);
    return;
  }
  if (p.kind === 'window') {
    // window frame behind the sill
    ctx.fillStyle = C.cream; rr(p.x + 20, p.y - 190, p.w - 40, 180, 90); ctx.fill();
    ctx.strokeStyle = C.woodDk; ctx.lineWidth = 8;
    rr(p.x + 20, p.y - 190, p.w - 40, 180, 90); ctx.stroke();
    ctx.fillStyle = C.mustard;
    ctx.beginPath(); ctx.arc(p.x + p.w/2, p.y - 100, 34, 0, 7); ctx.fill();
    ctx.fillStyle = C.wood; rr(p.x, p.y, p.w, p.h, 4); ctx.fill();
    return;
  }
  // shelves / top
  ctx.fillStyle = p.kind === 'top' ? C.terra : C.wood;
  rr(p.x, p.y, p.w, p.h, 4); ctx.fill();
  ctx.fillStyle = C.shadow;
  ctx.fillRect(p.x + 6, p.y + p.h, p.w - 12, 6);
}

function drawPlant(x, baseY) {
  // vase (mustard, like reference)
  ctx.fillStyle = C.mustard;
  rr(x - 26, baseY - 78, 52, 78, 18); ctx.fill();
  // leaves
  ctx.fillStyle = C.cat;
  ctx.save(); ctx.translate(x, baseY - 78);
  for (const [ang, len] of [[-1.9, 70], [-2.4, 58], [-1.2, 66], [-0.7, 52], [-1.6, 84]]) {
    ctx.save(); ctx.rotate(ang + Math.sin(performance.now()/900 + len) * 0.03);
    ctx.beginPath(); ctx.ellipse(len * 0.6, 0, len * 0.55, 12, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawMug() {
  if (mug.broken) {
    ctx.fillStyle = C.terra;
    ctx.beginPath(); ctx.moveTo(mug.x - 16, mug.y);
    ctx.lineTo(mug.x - 6, mug.y - 10); ctx.lineTo(mug.x + 2, mug.y);
    ctx.lineTo(mug.x + 10, mug.y - 8); ctx.lineTo(mug.x + 18, mug.y);
    ctx.closePath(); ctx.fill();
    return;
  }
  const wob = mug.falling ? Math.sin(mug.wob * 20) * 0.4 : 0;
  ctx.save(); ctx.translate(mug.x, mug.y); ctx.rotate(wob);
  ctx.fillStyle = C.terra;
  rr(-mug.r, -mug.r * 1.6, mug.r * 2, mug.r * 1.6, 4); ctx.fill();
  ctx.strokeStyle = C.terra; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(mug.r + 4, -mug.r * 0.8, 7, -1.2, 1.2); ctx.stroke();
  ctx.restore();
}

// --- cat drawing helpers -------------------------------------------------
function catTail(pts, w) {
  // two chained bezier segments with tapering width and a rounded tip
  const [a, c1, c2, m, c3, c4, tip] = pts;
  ctx.strokeStyle = C.cat; ctx.lineCap = 'round';
  ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]);
  ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], m[0], m[1]);
  ctx.stroke();
  ctx.lineWidth = w * 0.62;
  ctx.beginPath(); ctx.moveTo(m[0], m[1]);
  ctx.bezierCurveTo(c3[0], c3[1], c4[0], c4[1], tip[0], tip[1]);
  ctx.stroke();
  ctx.fillStyle = C.cat;
  ctx.beginPath(); ctx.arc(tip[0], tip[1], w * 0.36, 0, 7); ctx.fill();
}

function catEars(hx, hy, hr, flat) {
  ctx.fillStyle = C.cat;
  ctx.beginPath();
  ctx.moveTo(hx - hr * 0.78, hy - hr * 0.4);
  ctx.quadraticCurveTo(hx - hr * 1.2, hy - hr * 1.55 + flat, hx - hr * 0.84, hy - hr * 2.2 + flat);
  ctx.quadraticCurveTo(hx - hr * 0.32, hy - hr * 1.32, hx - hr * 0.05, hy - hr * 0.9);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx + hr * 0.88, hy - hr * 0.4);
  ctx.quadraticCurveTo(hx + hr * 1.3, hy - hr * 1.55 + flat, hx + hr * 0.94, hy - hr * 2.2 + flat);
  ctx.quadraticCurveTo(hx + hr * 0.42, hy - hr * 1.32, hx + hr * 0.15, hy - hr * 0.9);
  ctx.closePath(); ctx.fill();
  // inner-ear accent, barely lighter than the coat
  ctx.fillStyle = '#453B31';
  ctx.beginPath();
  ctx.moveTo(hx - hr * 0.58, hy - hr * 0.78);
  ctx.lineTo(hx - hr * 0.8, hy - hr * 1.75 + flat);
  ctx.lineTo(hx - hr * 0.3, hy - hr * 1.05);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx + hr * 0.68, hy - hr * 0.78);
  ctx.lineTo(hx + hr * 0.9, hy - hr * 1.75 + flat);
  ctx.lineTo(hx + hr * 0.4, hy - hr * 1.05);
  ctx.closePath(); ctx.fill();
}

function catFace(hx, hy, hr, t, lookUp) {
  const blink = (Math.sin(t * 0.7) > 0.995) ? 0.12 : 1;
  const ey = hy + hr * 0.14 - (lookUp ? hr * 0.14 : 0);
  const er = hr * 0.35;
  // white ring eyes with a live little pupil
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(hx - hr * 0.48, ey, er, er * blink, 0, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(hx + hr * 0.55, ey, er, er * blink, 0, 0, 7); ctx.stroke();
  if (blink === 1) {
    const px = hr * 0.08, py = lookUp ? -hr * 0.1 : hr * 0.05;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(hx - hr * 0.48 + px, ey + py, hr * 0.12, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(hx + hr * 0.55 + px, ey + py, hr * 0.12, 0, 7); ctx.fill();
  }
  // blush nose
  ctx.fillStyle = C.blush;
  ctx.beginPath();
  ctx.moveTo(hx - hr * 0.04, ey + hr * 0.46);
  ctx.lineTo(hx + hr * 0.16, ey + hr * 0.46);
  ctx.lineTo(hx + hr * 0.06, ey + hr * 0.62);
  ctx.closePath(); ctx.fill();
  // whiskers, faint so the silhouette stays graphic
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(hx - hr * 0.8, ey + hr * 0.42); ctx.lineTo(hx - hr * 1.55, ey + hr * 0.26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx - hr * 0.8, ey + hr * 0.56); ctx.lineTo(hx - hr * 1.5, ey + hr * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx + hr * 0.9, ey + hr * 0.42); ctx.lineTo(hx + hr * 1.65, ey + hr * 0.26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx + hr * 0.9, ey + hr * 0.56); ctx.lineTo(hx + hr * 1.6, ey + hr * 0.6); ctx.stroke();
}

function drawCat() {
  const t = cat.tailT;
  ctx.save();
  ctx.translate(cat.x, cat.y);

  // shadow
  ctx.fillStyle = C.shadow;
  ctx.beginPath(); ctx.ellipse(0, 2, cat.w * 0.55, 6, 0, 0, 7); ctx.fill();

  const sy = cat.squash, sx = 2 - cat.squash; // conserve "volume"
  ctx.scale(cat.facing * sx, sy);

  const air = cat.state === 'air';
  const hang = cat.state === 'hang';
  const sneak = cat.state === 'sneak';
  const slide = cat.state === 'slide';
  const sway = Math.sin(t * 2.2) * 8;

  ctx.fillStyle = C.cat;
  ctx.strokeStyle = C.cat;
  ctx.lineCap = 'round';

  let hx, hy, hr; // head center + radius, for ears/face
  if (hang) {
    // ---- hanging: paws hooked over the lip, body dangling, peeking up ----
    hx = 10; hy = -22; hr = 13.5;
    catTail([[-4,-4],[-8,10+sway*0.4],[-20,16+sway*0.8],[-19,4+sway],
             [-18,-4+sway],[-13,-8+sway*0.8],[-10,-3+sway*0.7]], 9);
    // body: soft teardrop hanging from the forelegs
    ctx.fillStyle = C.cat;
    ctx.beginPath();
    ctx.moveTo(15, -33);
    ctx.bezierCurveTo(23, -20, 19, -2, 6, 1);
    ctx.bezierCurveTo(-6, 4, -14, -7, -10, -21);
    ctx.bezierCurveTo(-8, -29, -2, -34, 5, -35);
    ctx.closePath(); ctx.fill();
    // forelegs stretched up and forward onto the ledge
    ctx.strokeStyle = C.cat; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(23, -39); ctx.lineTo(14, -27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13, -41); ctx.lineTo(7, -29); ctx.stroke();
    // paws gripping over the lip, with tiny toes
    ctx.fillStyle = C.cat;
    ctx.beginPath(); ctx.arc(25, -40, 5.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(14, -42, 5.5, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(237,227,212,.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(23.5, -44); ctx.lineTo(23.5, -40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(26.5, -44); ctx.lineTo(26.5, -40); ctx.stroke();
    // head below the paws, tilted up
    ctx.fillStyle = C.cat;
    ctx.beginPath(); ctx.ellipse(hx, hy, hr, hr * 0.94, -0.12, 0, 7); ctx.fill();
  } else if (slide) {
    // ---- wall slide: pressed against the wall, claws hooked, easing down ----
    hx = 6; hy = -50; hr = 13;
    catTail([[-8,-8],[-20,-2+sway*0.5],[-30,-14+sway],[-26,-28+sway*0.7],
             [-23,-38+sway*0.5],[-16,-44+sway*0.4],[-12,-38+sway*0.3]], 9);
    // vertical body hugging the wall
    ctx.fillStyle = C.cat;
    ctx.beginPath(); ctx.ellipse(3, -26, 12.5, 23, 0.1, 0, 7); ctx.fill();
    // legs braced on the wall
    ctx.strokeStyle = C.cat; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(8, -42); ctx.lineTo(17, -46); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7, -14); ctx.lineTo(16, -16); ctx.stroke();
    ctx.fillStyle = C.cat;
    ctx.beginPath(); ctx.arc(18, -47, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(17, -17, 5, 0, 7); ctx.fill();
    // head looking up to where it wants to go
    ctx.beginPath(); ctx.ellipse(hx, hy, hr, hr * 0.94, -0.15, 0, 7); ctx.fill();
  } else if (sneak) {
    // ---- sneaking: low, long, head forward, gentle prowl bob ----
    ctx.translate(0, Math.sin(t * 13) * 1.3);
    hx = 22; hy = -19; hr = 11;
    catTail([[-22,-10],[-34,-8+sway*0.4],[-42,-14+sway*0.8],[-40,-22+sway],
             [-38,-28+sway],[-32,-31+sway*0.9],[-28,-27+sway*0.8]], 8);
    // low stretched body, back slightly arched
    ctx.fillStyle = C.cat;
    ctx.beginPath();
    ctx.moveTo(-26, 0);
    ctx.bezierCurveTo(-30, -14, -18, -23, -2, -22);
    ctx.bezierCurveTo(8, -22, 14, -24, 18, -25);
    ctx.bezierCurveTo(20, -14, 16, -3, 8, 0);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-4, -10, 24, 10, 0.06, 0, 7); ctx.fill();
    // head low and forward
    ctx.beginPath(); ctx.ellipse(hx, hy, hr, hr * 0.9, 0.12, 0, 7); ctx.fill();
  } else if (air) {
    // ---- airborne: arched leap, front legs reaching for the landing ----
    hx = 12; hy = -42; hr = 12.5;
    catTail([[-14,-10],[-30,-2+sway],[-46,-14+sway],[-46,-32+sway*0.6],
             [-46,-44+sway*0.4],[-38,-52+sway*0.3],[-32,-47+sway*0.3]], 10);
    ctx.fillStyle = C.cat;
    ctx.beginPath(); ctx.ellipse(-4, -22, 20, 14, -0.32, 0, 7); ctx.fill();  // arched torso
    ctx.beginPath(); ctx.ellipse(7, -32, 13, 12, -0.15, 0, 7); ctx.fill();   // shoulders
    // front legs reaching out
    ctx.strokeStyle = C.cat; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(12, -26); ctx.lineTo(24, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -24); ctx.lineTo(17, -9); ctx.stroke();
    ctx.fillStyle = C.cat;
    ctx.beginPath(); ctx.arc(25, -11, 4.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(18, -8, 4.5, 0, 7); ctx.fill();
    // hind leg tucked under
    ctx.beginPath(); ctx.ellipse(-15, -12, 9, 7, 0.5, 0, 7); ctx.fill();
    // head leading the jump
    ctx.beginPath(); ctx.ellipse(hx, hy, hr, hr * 0.95, -0.12, 0, 7); ctx.fill();
  } else {
    // ---- sitting: organic silhouette, S-curved back, asymmetric rump ----
    hx = 3; hy = -59; hr = 15;
    catTail([[-6,-4],[-30,4],[-46,-2+sway*0.4],[-44,-26+sway],
             [-43,-46+sway],[-32,-58+sway],[-23,-50+sway*0.7]], 11);
    ctx.fillStyle = C.cat;
    ctx.beginPath();
    ctx.moveTo(-22, 0);                                  // base left, flared
    ctx.bezierCurveTo(-27, -13, -23, -27, -13, -38);     // round rump
    ctx.bezierCurveTo(-9, -43, -10, -50, -8, -55);       // waist dips in (S-curve)
    ctx.bezierCurveTo(-7, -71, 13, -72, 14, -57);        // crown, slightly tilted
    ctx.bezierCurveTo(15, -51, 12, -46, 14, -40);        // jaw into neck
    ctx.bezierCurveTo(19, -29, 21, -14, 18, 0);          // chest slope, narrower base
    ctx.closePath(); ctx.fill();
    // haunch, tilted so the mass reads organic rather than circular
    ctx.beginPath(); ctx.ellipse(-4, -12, 19, 13, -0.1, 0, 7); ctx.fill();
    // chest fluff
    ctx.beginPath(); ctx.ellipse(13, -26, 6, 9, 0.3, 0, 7); ctx.fill();
    // front paws side by side, tiny toe notches
    ctx.beginPath(); ctx.ellipse(5, -2, 7, 4.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(15, -2, 6.5, 4, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(237,227,212,.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(5, -0.5); ctx.lineTo(5, 1.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(15, -0.5); ctx.lineTo(15, 1.5); ctx.stroke();
  }

  const flat = air ? 6 : (sneak ? 8 : 0); // ears back mid-air / flattened prowling
  catEars(hx, hy, hr, flat);
  catFace(hx, hy, hr, t, hang || slide || air);

  ctx.restore();
}

function drawWin() {
  winT += 1/60;
  ctx.fillStyle = 'rgba(42,37,29,' + Math.min(0.75, winT * 0.4) + ')';
  ctx.fillRect(0, 0, W, H);
  if (winT > 0.8) {
    ctx.fillStyle = C.cream;
    ctx.font = '28px Georgia, serif'; ctx.textAlign = 'center';
    ctx.fillText('Nero conoce esta casa de memoria.', W/2, H/2 - 20);
    ctx.font = '17px Georgia, serif';
    ctx.fillStyle = C.sand;
    ctx.fillText('Encontraste los 3 recuerdos · toca ↺ para volver a jugar', W/2, H/2 + 20);
  }
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;

  if (!gameWon) {
    stepCat(dt);
    stepMug(dt);
    stepProps(dt);
  }
  stepCam(dt);

  drawBackground();
  ctx.save();
  ctx.scale(cam.scale, cam.scale);
  ctx.translate(-cam.x, -cam.y);

  for (const p of platforms) drawPlatform(p);
  const top = platforms.find(p => p.kind === 'top');
  drawPlant(top.x + top.w - 55, top.y);
  drawMug();
  drawProps();
  drawCat();

  ctx.restore();

  if (gameWon) drawWin();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
