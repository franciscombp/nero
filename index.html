<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nero · una historia de gato</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles/main.css">
<style>
  /* el cronómetro del callejón no debe pisar los pills del HUD */
  #level-timer { top: 64px !important; }
</style>
<meta name="theme-color" content="#F4ECE3">
<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="hud">
  <div id="epLabel"><b id="epNum"></b><span id="epName"></span></div>
  <div id="dots"></div>
  <button id="reset" title="Reiniciar episodio">↺</button>
</div>
<div id="titlecard"><b id="tcNum"></b><span id="tcName"></span></div>
<div id="subtitle"></div>
<div id="hint"></div>
<div id="overlay"><div id="ocard">
  <div class="catface" id="oface">🐈‍⬛</div>
  <div class="kicker" id="okicker"></div>
  <h1 id="otitle"></h1>
  <h2 id="osub"></h2>
  <p id="otext"></p>
  <button id="obtn"></button>
</div></div>

<script type="module">
// Nero en el motor 3D: mismo contenido y mecánicas que el juego 2D (data/scenes.json),
// renderizado como diorama 2.5D. La lógica de gameplay replica index.html.
import { CONFIG, createCat, createLevelState, loadLevel, resetCat, createPushable, checkMemoryTriggers, checkKnockTrigger, checkGoalTrigger, checkPuzzleCondition, createInteractives, canOpenInteractive, createCarryables, nearCarryable, landedOnPan } from './js/core.js';
import { createPhysics } from './js/physics.js';
import { createUI } from './js/ui.js';
import { createRenderer3D } from './js/renderer3d.js';
import { doJump as jumpAction, tryTargetJump as targetJumpAction, doDrop as dropAction, applySneak } from './js/actions.js';

async function main() {
  const canvas = document.getElementById('game');

  // Datos: los mismos del juego 2D — con soporte de borrador del editor (?draft=1)
  const useDraft = new URLSearchParams(location.search).has('draft');
  const draftScenes = useDraft ? localStorage.getItem('nero-draft-scenes') : null;
  const draftStory = useDraft ? localStorage.getItem('nero-draft-stories') : null;
  const [levelsRes, storiesRes] = await Promise.all([
    fetch('data/scenes.json'),
    fetch('data/stories.json')
  ]);
  const levels = draftScenes ? JSON.parse(draftScenes) : await levelsRes.json();
  const story = draftStory ? JSON.parse(draftStory) : await storiesRes.json();

  const physics = createPhysics(CONFIG);
  const ui = createUI();
  const cat = createCat();
  const levelState = createLevelState();
  const r3d = createRenderer3D(canvas);

  let W = window.innerWidth, H = window.innerHeight;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    r3d.resize(W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  // Cinemáticas de la historia de origen (mismas que el 2D)
  const cinematics = {
    2: {
      text: `Nero no llegó a tiempo. Resbala, cae y se queda quieto en el barro.<br><br>Una sombra enorme lo cubre.<br>Una voz profunda dice: «¿Qué haces aquí, pequeño?»<br><br>Pero las manos son suaves, y lo levantan<br>como se levanta algo que se puede romper.`,
      duration: 5200
    },
    5: {
      text: `<b>Pasan los meses.</b><br><br>Nero ya no cabe en una mano.<br>Aprende dónde da el sol a cada hora,<br>qué escalón cruje y en qué silla no debe dormir.<br><br>Aprende la casa como se aprende un idioma:<br><b>sin darse cuenta.</b>`,
      duration: 6000
    }
  };

  // Rama A (llegó al camión) vs Rama B (lo recogió el conductor)
  function recordBranch(branchId) {
    try {
      const data = JSON.parse(localStorage.getItem('nero_branches') || '{}');
      data.origin = branchId;
      data.timestamp = new Date().toISOString();
      localStorage.setItem('nero_branches', JSON.stringify(data));
    } catch (e) { /* almacenamiento no disponible */ }
  }

  const curLevel = () => levels[levelState.level];

  function getMovementMods() {
    const L = curLevel();
    if (!L?.mechanics?.babyKitten) return { speed: 1, jump: 1 };
    return { speed: L.mechanics.speed || 0.7, jump: L.mechanics.jumpHeight || 0.8 };
  }

  // El jugador solo recibe texto de ayuda si lleva rato sin avanzar. Cualquier
  // acción con sentido reinicia el reloj: guiar sin estorbar.
  let idleT = 0, hintsGiven = 0, missingCarryShown = false;
  function noteProgress() {
    idleT = 0;
    ui.hideHint();
  }

  let jumpBuffer = null;   // pulsación en el aire → se dispara al aterrizar (game feel)
  function doJump(dir, big) {
    if (levelState.mode !== 'play') return;
    const L = curLevel();
    const wasGrounded = cat.onGround;
    if (jumpAction(cat, dir, big, getMovementMods())) {
      noteProgress();
      jumpBuffer = null;
      // Nivel de la caja: cada salto desde el suelo cuenta y sacude la caja
      if (L?.goalKind === 'jumps_counted' && wasGrounded) {
        levelState.jumpCount++;
        levelState.lastJumpDir = dir;
        levelState.boxAnimT = 0.001;
      }
    } else if (!cat.onGround) {
      // en la caja el búfer no caduca: machacar el botón nunca pierde saltos
      const hold = L?.goalKind === 'jumps_counted' ? 3 : 0.22;
      jumpBuffer = { dir, big, t: hold };
    }
  }
  function doDrop() {
    if (levelState.mode !== 'play') return;
    dropAction(cat, levelState.platforms);
  }

  // ---------- Input (mismos gestos que el 2D; el tap se proyecta al plano de juego) ----------
  let pressT = null, pressZone = 0, pressStart = null, sneakTouch = 0;
  const pointers = new Set();
  const held = { l: false, r: false, shift: false };
  const sneakDir = () => sneakTouch || (held.shift ? (held.r ? 1 : 0) - (held.l ? 1 : 0) : 0);

  canvas.addEventListener('pointerdown', e => {
    pointers.add(e.pointerId);
    if (pointers.size >= 2) { doJump(pressZone, true); pressT = null; return; }
    pressZone = e.clientX < W / 3 ? -1 : (e.clientX > 2 * W / 3 ? 1 : 0);
    pressT = performance.now();
    pressStart = { x: e.clientX, y: e.clientY };
    if (levelState.mode === 'play' && cat.onGround && cat.state !== 'hang') {
      cat.state = 'charge'; cat.squash = 0.8;
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (!pressStart || pointers.size !== 1) return;
    const dx = e.clientX - pressStart.x, dy = e.clientY - pressStart.y;
    if (Math.abs(dx) > 22 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      sneakTouch = Math.sign(dx);
      pressT = null;
      noteProgress();
    }
  });
  function releasePointer(e) {
    pointers.delete(e.pointerId);
    const start = pressStart;
    if (pointers.size === 0) { sneakTouch = 0; pressStart = null; }
    if (pressT === null) return;
    const heldMs = performance.now() - pressT;
    pressT = null;
    if (start && e.clientX !== undefined) {
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (dy < -30) {
        const dir = dx > 36 ? 1 : dx < -36 ? -1 : 0;
        const big = -dy > 130 || (heldMs < 180 && -dy > 70);
        doJump(dir, big);
        return;
      }
      if (dy > 30 && Math.abs(dy) > Math.abs(dx)) { doDrop(); return; }
    }
    const { wx, wy } = r3d.screenToWorld(e.clientX, e.clientY);
    if (levelState.mode === 'play' && tryCarry(wx, wy)) return;
    if (levelState.mode === 'play' && tryInteract(wx, wy)) return;
    if (levelState.mode === 'play' && curLevel()?.goalKind !== 'jumps_counted' &&
        targetJumpAction(cat, levelState.platforms, wx, wy)) {
      noteProgress();
    } else {
      const dir = Math.abs(wx - cat.x) > 40 ? Math.sign(wx - cat.x) : 0;
      doJump(dir, heldMs > 350);
    }
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);

  window.addEventListener('keydown', e => {
    if (e.key === 'Shift') held.shift = true;
    if (e.key === 'ArrowLeft') held.l = true;
    if (e.key === 'ArrowRight') held.r = true;
    if (e.repeat) return;
    if (e.key === 'ArrowLeft') { if (!e.shiftKey) doJump(-1, false); }
    else if (e.key === 'ArrowRight') { if (!e.shiftKey) doJump(1, false); }
    // ↑ salta hacia donde ya estás mirando: mantener ← o → y pulsar ↑ da el salto
    // dirigido, y con Shift el supersalto dirigido. Sin esto el teclado no tenía
    // forma de hacer un supersalto en diagonal y había niveles imposibles.
    else if (e.key === 'ArrowUp' || e.key === ' ') doJump(held.r ? 1 : held.l ? -1 : 0, e.shiftKey);
    else if (e.key === 'ArrowDown') doDrop();
    else if (e.key === 'r' || e.key === 'R') { if (levelState.mode === 'play') resetLevel(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'Shift') held.shift = false;
    if (e.key === 'ArrowLeft') held.l = false;
    if (e.key === 'ArrowRight') held.r = false;
  });
  ui.onResetClick(() => { if (levelState.mode === 'play') resetLevel(); });

  // ---------- Flujo de niveles ----------
  function startLevel(idx) {
    levelState.level = idx;
    resetCat(cat, levels[idx].spawn);
    loadLevel(levelState, levels[idx]);

    const L = levels[idx];
    levelState.pushables = (L.pushables || []).map(p => createPushable(p));
    // interactivos del puzzle: se copian las plataformas base para poder
    // inyectar los cajones abiertos sin mutar los datos del nivel
    levelState.basePlatforms = levelState.platforms.slice();
    levelState.interactives = createInteractives(L, levelState.platforms);
    levelState.carryables = createCarryables(L, levelState.platforms);
    levelState.puzzles = L.puzzles || [];
    levelState.puzzleSolved = {};
    levelState.boxTiltAngle = 0;
    levelState.boxAnimT = 0;
    levelState.lastJumpDir = 0;

    r3d.loadScene(L, levelState);
    r3d.setCatVisible(true);
    // en la caja, Nero empieza dentro (visible gracias al corte frontal)
    if (L.goalKind === 'jumps_counted' && levelState.pushables[0]) {
      const box = levelState.pushables[0];
      cat.x = box.x + box.w / 2;
    }
    ui.updateHUD(idx, levels, levelState.memories, levelState.found, levelState.puzzles, levelState.puzzleSolved);
    ui.setHintText(L.hint ?? story?.ui?.hint ?? '');
    ui.hideHint();
    ui.hideMemory();          // que no quede colgado el subtítulo del episodio anterior
    idleT = 0;
    hintsGiven = 0;
    missingCarryShown = false;
  }

  // Efectos que solo deben dispararse al empezar a JUGAR el nivel (no con la tarjeta abierta)
  function enterPlay() {
    levelState.mode = 'play';
    jumpBuffer = null;
    const L = curLevel();

    // recuerdos con disparador de inicio
    setTimeout(() => {
      if (levelState.mode !== 'play') return;
      for (const m of levelState.memories) if (m.trigger === 'start') collect(m.id);
    }, L?.intro ? 7400 : 900);

    // niveles solo-cinemática: se cuentan solos
    if (L?.mechanics?.cinematicOnly) {
      const cin = cinematics[levelState.level];
      levelState.levelDone = true;   // sin gameplay
      ui.showCinematic(cin?.text ?? L.intro, cin?.duration ?? 4000);
      setTimeout(() => {
        const gm = levelState.memories.find(m => m.trigger === 'goal');
        if (gm) collect(gm.id);
        completeLevel();
      }, (cin?.duration ?? 4000) + 300);
      return;
    }

    // reto contrarreloj del callejón: al agotarse, Nero no llega al camión → Rama B
    if (L?.mechanics?.timerChallenge) {
      ui.startLevelTimer(L.mechanics.timerChallenge, () => {
        if (levelState.levelDone) return;
        recordBranch('branch_b');
        levelState.levelDone = true;
        setTimeout(() => completeLevel(2), 900);   // nivel 2 = cinemática de la Rama B
      });
    }
  }

  function resetLevel() {
    ui.stopLevelTimer();
    startLevel(levelState.level);
    enterPlay();
  }

  function completeLevel(target) {
    ui.stopLevelTimer();
    // salir de 'play' YA: si no, durante la espera el episodio siguiente queda
    // anunciado pero con la sala anterior todavía cargada
    levelState.mode = 'ui';
    const next = target ?? levelState.level + 1;
    if (next < levels.length) {
      levelState.level = next;
      setTimeout(showAct, 1400);
    } else {
      const total = levels.reduce((sum, s) => sum + s.memories.length, 0);
      setTimeout(() => ui.showCard({
        face: '🌙', kicker: 'fin', sub: 'La casa llena',
        text: `${story?.ui?.final ?? 'La casa nunca estuvo vacía: estaba llena de ellos.'}<br><br>🐾 Recuerdos encontrados: <b>${levelState.totalFound} / ${total}</b>`,
        btn: 'Jugar otra vez',
        then: () => { levelState.totalFound = 0; levelState.level = 0; showAct(); }
      }), 1400);
    }
  }

  function showTitle() {
    levelState.mode = 'ui';
    ui.showCard({
      kicker: story?.title?.kicker ?? 'una historia de gato',
      title: story?.title?.title ?? 'N E R O',
      text: story?.title?.body ?? '',
      btn: 'Empezar',
      then: showAct
    });
  }

  // Sin modal entre episodios: el título aparece sobre la habitación, la
  // introducción baja como subtítulo y el jugador ya tiene el control.
  function showAct() {
    levelState.mode = 'ui';
    startLevel(levelState.level);
    const L = curLevel();
    ui.showEpisode(L.kicker, L.name, L.intro);
    setTimeout(enterPlay, 650);
  }

  // Los interactivos abiertos se añaden AL FINAL de la lista de plataformas:
  // así los índices de las metas custom y del knock siguen siendo válidos.
  function stepInteractives(dt) {
    const list = levelState.interactives;
    if (!list || !list.length) return;
    let dirty = false;
    for (const o of list) {
      // el contrapeso se dispara solo cuando cae el peso del otro lado
      if (o.kind === 'counterweight') {
        if (o.trigger === 'knock' && levelState.knock?.broken) o.target = 1;
        const prevY = o.platform.y;
        o.platform.y = o.baseY - (o.travel ?? 200) * o.open;
        const dY = o.platform.y - prevY;
        // si el gato viaja encima, sube con ella
        if (dY !== 0 && cat.onGround && Math.abs(cat.y - prevY) < 3 &&
            cat.x > o.platform.x - 20 && cat.x < o.platform.x + o.platform.w + 20) {
          cat.y += dY;
        }
      }
      if (Math.abs(o.target - o.open) > 0.001) {
        o.open += (o.target - o.open) * Math.min(1, dt * 6);
        if (Math.abs(o.target - o.open) < 0.01) o.open = o.target;
        dirty = true;
      }
    }
    const shown = list.filter(o => o.platform && (o.always || o.open > 0.55));
    if (levelState.platforms.length !== levelState.basePlatforms.length + shown.length) dirty = true;
    if (dirty) {
      levelState.platforms = levelState.basePlatforms.concat(shown.map(o => o.platform));
    }
  }

  // Objetos en la boca. Llevarlos arriba es el coste; soltarlos es gratis.
  // De ahí sale la gramática: "haz que X caiga sobre Y".
  function stepCarryables(dt) {
    const list = levelState.carryables;
    if (!list || !list.length) return;
    for (const c of list) {
      if (c.held) {                       // viaja en la boca, delante del morro
        c.x = cat.x + cat.facing * 26;
        c.y = cat.y - 30;
        continue;
      }
      if (!c.falling) continue;
      c.vy += CONFIG.GRAV * 0.85 * dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      // aterriza sobre la primera superficie que encuentre: plataformas y,
      // sobre todo, las bandejas de los contrapesos (que no son plataformas)
      // solo cuentan las superficies POR DEBAJO del punto de suelta: si no, el
      // objeto se quedaría en la misma repisa desde la que lo tiras
      const below = (c.dropY ?? 0) + 30;
      let ground = CONFIG.FLOOR_Y - 6;
      for (const pl of levelState.platforms) {
        if (c.x > pl.x && c.x < pl.x + pl.w && pl.y > below && pl.y < ground) ground = pl.y - 6;
      }
      for (const o of (levelState.interactives || [])) {
        const pan = o.pan;
        if (!pan) continue;
        if (c.x > pan.x - 10 && c.x < pan.x + pan.w + 10 && pan.y > below && pan.y < ground) {
          ground = pan.y - 6;
        }
      }
      if (c.y >= ground) {
        c.y = ground; c.vy = 0; c.vx = 0;
        c.falling = false; c.landed = true;
        // ¿cayó en la bandeja de algún contrapeso? entonces dispara la máquina
        for (const o of (levelState.interactives || [])) {
          if (o.kind === 'counterweight' && o.trigger === 'drop:' + c.id && landedOnPan(c, o)) {
            o.target = 1;
            c.consumed = true;
            noteProgress();
          }
        }
      }
    }
  }

  // Coger / soltar con el mismo toque
  function tryCarry(wx, wy) {
    const list = levelState.carryables;
    if (!list || !list.length) return false;
    const held = list.find(c => c.held);
    if (held) {                            // soltar: cae desde donde esté el gato
      held.held = false;
      held.falling = true;
      held.dropY = cat.y;              // desde dónde se soltó: define qué puede pararlo
      held.vx = cat.facing * 30;
      held.vy = 0;
      noteProgress();
      return true;
    }
    for (const c of list) {
      if (c.consumed) continue;
      const hit = Math.abs(wx - c.x) < 60 && Math.abs(wy - c.y) < 70;
      if (hit && cat.onGround && nearCarryable(cat, c)) {
        c.held = true; c.landed = false;
        noteProgress();
        return true;
      }
    }
    return false;
  }

  // Devuelve true si el tap abrió un cajón (y por tanto no debe saltar)
  function tryInteract(wx, wy) {
    const list = levelState.interactives;
    if (!list || !list.length) return false;
    for (const o of list) {
      const p = o.platform;
      if (!p || o.kind !== 'drawer') continue;
      const hit = wx > p.x - 30 && wx < p.x + p.w + 30 && wy > p.y - 40 && wy < p.y + 90;
      if (!hit) continue;
      if (canOpenInteractive(o, cat, list)) { o.target = 1; noteProgress(); return true; }
      if (o.open > 0.5 && cat.y < p.y - 20) { o.target = 0; return true; }   // cerrar desde arriba
      return false;
    }
    return false;
  }

  function collect(id) {
    if (levelState.found[id]) return;
    idleT = 0;
    levelState.found[id] = true;
    levelState.totalFound++;
    const m = levelState.memories.find(m => m.id === id);
    if (m) ui.showMemory(m.text);
    ui.updatePaws(levelState.memories, levelState.found);
  }

  // ---------- Loop ----------
  let last = performance.now();
  let escapeAnim = null;   // arco escriptado de Nero saliendo de la caja
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    const L = curLevel();

    if (levelState.mode === 'play' && !levelState.levelDone) {
      for (const id of checkMemoryTriggers(cat, levelState, levelState.platforms)) collect(id);

      if (checkKnockTrigger(cat, levelState.knock)) {
        levelState.knock.falling = true;
        levelState.knock.vx = (levelState.knock.x > cat.x ? 1 : -1) * 120;
        levelState.knock.vy = -80;
      }

      physics.stepCat(cat, levelState.platforms, dt, levelState.mode, L, levelState.pushables);
      // salto en búfer: pulsado en el aire, ejecutado al tocar suelo
      if (jumpBuffer) {
        jumpBuffer.t -= dt;
        if (jumpBuffer.t <= 0) jumpBuffer = null;
        else if (cat.onGround) {
          const jb = jumpBuffer;
          jumpBuffer = null;
          doJump(jb.dir, jb.big);
        }
      }
      physics.stepKnock(levelState.knock, dt);
      physics.stepProps(levelState.yarn, levelState.books, levelState.bookShelfIdx, levelState.platforms, cat, dt);
      if (levelState.pushables.length) {
        physics.stepPushables(levelState.pushables, cat, levelState.platforms, dt, L);
      }
      applySneak(cat, levelState.platforms, sneakDir(), dt, getMovementMods().speed);
      stepInteractives(dt);
      stepCarryables(dt);

      const kn = levelState.knock;
      if (kn && kn.broken && kn.memoryId) collect(kn.memoryId);

      // la caja reacciona a cada salto: pulso + sacudida suave (las solapas
      // se abren con el progreso — eso lo dibuja el renderer)
      if (L?.goalKind === 'jumps_counted') {
        const box = levelState.pushables[0];
        // Nero no puede salirse de la caja hasta escapar por arriba
        if (box) cat.x = Math.max(box.x + 44, Math.min(box.x + box.w - 44, cat.x));
        if (levelState.boxAnimT > 0 && levelState.boxAnimT < 1) {
          levelState.boxAnimT += dt / levelState.boxAnimDuration;
          const t = Math.min(levelState.boxAnimT, 1);
          levelState.boxPulse = Math.sin(Math.min(t / 0.55, 1) * Math.PI);
          const dirSign = levelState.lastJumpDir === 0 ? 1 : Math.sign(levelState.lastJumpDir);
          levelState.boxTiltAngle = Math.sin(t * Math.PI * 2) * 0.05 * dirSign;
          if (t >= 1) { levelState.boxAnimT = 0; levelState.boxPulse = 0; levelState.boxTiltAngle = 0; }
        } else {
          levelState.boxPulse = 0;
          levelState.boxTiltAngle = 0;
        }
      }

      // puzzles
      for (const puzzle of levelState.puzzles) {
        if (!levelState.puzzleSolved[puzzle.id] && checkPuzzleCondition(puzzle, levelState)) {
          levelState.puzzleSolved[puzzle.id] = true;
          ui.updateHUD(levelState.level, levels, levelState.memories, levelState.found, levelState.puzzles, levelState.puzzleSolved);
        }
      }

      // ¿atascado? a los 15 s sin avanzar se ofrece la pista del episodio,
      // y solo dos veces: si no sirve, es un problema de diseño, no de texto
      idleT += dt;
      if (idleT > 15 && hintsGiven < 2 && !ui.isHintShown()) {
        const h = ui.getHintText();
        if (h) { ui.showHint(h); hintsGiven++; }
        idleT = 0;
      }

      // meta
      // Algunos episodios no piden llegar, piden llegar CON algo en la boca.
      // Si Nero está en la meta con las manos vacías, la casa se lo recuerda.
      const atGoal = checkGoalTrigger(cat, levelState.platforms, L.goalKind, levelState);
      if (atGoal && L.goalCarry &&
          !(levelState.carryables || []).some(c => c.held && c.id === L.goalCarry)) {
        if (!missingCarryShown) {
          missingCarryShown = true;
          ui.showHint(L.carryHint || 'Le falta algo en la boca');
        }
      } else if (atGoal) {
        levelState.levelCompleteTime = now;
        const gm = levelState.memories.find(m => m.trigger === 'goal');
        if (gm) collect(gm.id);

        let target;
        if (levelState.level === 1 && L.mechanics?.branchId === 'branch_a') {
          recordBranch('branch_a');
          target = 3;   // llegó al camión: la Rama B (cinemática de rescate) no ocurre
        }
        if (L.goalKind === 'jumps_counted') {
          // escape: las solapas se abren del todo y Nero salta fuera, al borde de la caja
          const box = levelState.pushables[0];
          if (box) {
            escapeAnim = {
              t: 0, dur: 0.8,
              fromX: cat.x, fromY: cat.y,
              toX: box.x + box.w / 2, toY: box.y
            };
          }
        }
        levelState.levelDone = true;
        setTimeout(() => completeLevel(target), 1800);
      }
    } else {
      cat.tailT += dt;
      // arco de escape de la caja (corre mientras el nivel está "hecho")
      if (escapeAnim) {
        escapeAnim.t += dt;
        const k = Math.min(1, escapeAnim.t / escapeAnim.dur);
        cat.x = escapeAnim.fromX + (escapeAnim.toX - escapeAnim.fromX) * k;
        const arc = Math.sin(k * Math.PI) * 150;
        cat.y = escapeAnim.fromY + (escapeAnim.toY - escapeAnim.fromY) * k - arc;
        cat.facing = 1;
        cat.state = k < 1 ? 'air' : 'idle';
        cat.squash = k < 1 ? 1.2 : 1;
        if (k >= 1) { cat.y = escapeAnim.toY; escapeAnim = null; }
      }
    }
    if (levelState.mode === 'ui') escapeAnim = null;

    const isBoxLevel = L?.goalKind === 'jumps_counted';
    const box = isBoxLevel ? levelState.pushables[0] : null;
    r3d.update(dt, {
      cat,
      knock: levelState.knock,
      yarn: levelState.yarn,
      books: levelState.books,
      bookShelfIdx: levelState.bookShelfIdx,
      platforms: levelState.platforms,
      pushables: levelState.pushables,
      interactives: levelState.interactives,
      carryables: levelState.carryables,
      boxTilt: levelState.boxTiltAngle,
      boxPulse: levelState.boxPulse || 0,
      baby: !!L?.mechanics?.babyKitten,
      jumpCounter: isBoxLevel ? {
        count: levelState.jumpCount,
        required: L.goalParams?.requiredJumps || 8,
        complete: levelState.jumpCount >= (L.goalParams?.requiredJumps || 8)
      } : null,
      focus: box ? { x: box.x + box.w / 2, y: box.y + box.h / 2 } : null
    });
    r3d.render();
    requestAnimationFrame(frame);
  }

  startLevel(0);
  showTitle();
  requestAnimationFrame(frame);

  // Globals para testing/debug
  window.CONFIG = CONFIG;
  window.cat = cat;
  window.levelState = levelState;
  window.levels = levels;
  window.__enterPlay = enterPlay;
  window.__showAct = showAct;
}

main().catch(err => {
  console.error(err);
  document.body.insertAdjacentHTML('beforeend',
    `<div style="position:fixed;inset:auto 10px 10px;background:#FBF6EE;border-radius:12px;padding:12px;color:#4A4139;font-size:13px">Error al cargar Nero 3D: ${err.message}</div>`);
});
</script>
</body>
</html>
