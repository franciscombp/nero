<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nero · una historia de gato</title>
<link rel="stylesheet" href="styles/main.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4ECE3">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="pill" id="acto">—</div>
  <div class="pill" id="paws"></div>
  <div class="pill" id="reset">↺</div>
  <div class="pill" id="editor-btn" style="margin-left: auto; cursor: pointer; font-weight: bold; pointer-events: auto;">🎨 EDITOR</div>
</div>
<div id="memory"></div>
<div id="hint">Desliza ↑ ↖ ↗ para saltar (largo = supersalto) · ↓ para bajar<br>Toca un mueble para saltar hacia él · arrastra al lado = sigiloso</div>
<div id="overlay"><div id="ocard">
  <div class="catface" id="oface">🐈‍⬛</div>
  <div class="kicker" id="okicker"></div>
  <h1 id="otitle"></h1>
  <h2 id="osub"></h2>
  <p id="otext"></p>
  <button id="obtn"></button>
</div></div>

<script src="js/polyfills.js"></script>
<script type="module">
import { CONFIG, createCat, createCamera, createLevelState, loadLevel, resetCat, resetCamera, checkMemoryTriggers, checkKnockTrigger, checkGoalTrigger } from './js/core.js';
import { createRenderer } from './js/renderer.js';
import { createPhysics } from './js/physics.js';
import { createUI } from './js/ui.js';
import { createInputManager } from './js/input.js';
import { createLevelEditor } from './js/levelEditor.js';

async function main() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Load game data
  const [levelsRes, storiesRes] = await Promise.all([
    fetch('data/scenes.json'),
    fetch('data/stories.json')
  ]);
  const levels = await levelsRes.json();
  const story = await storiesRes.json();

  // Create game systems
  const config = { ...CONFIG, W, H, currentLevel: 0 };
  const renderer = createRenderer(ctx, config);
  const physics = createPhysics(config);
  const ui = createUI();
  const cat = createCat();
  const cam = createCamera();
  const levelState = createLevelState();
  const levelEditor = createLevelEditor(canvas, ctx, config, levels);

  // Input setup
  const inputMgr = createInputManager(canvas, config);
  let hintShown = true;

  inputMgr.setCallbacks({
    onJump: ({ dir, big }) => {
      const result = doJump(dir, big);
      hintShown = result.hintShown;
    },
    onDrop: () => doDrop(),
    onTargetJump: ({ x, y }) => tryTargetJump(x, y),
    onChargeStart: () => {
      if (levelState.mode === 'play' && cat.onGround && cat.state !== 'hang') {
        cat.state = 'charge';
        cat.squash = 0.8;
      }
    },
    onHideHint: () => {
      if (hintShown) {
        hintShown = false;
        ui.hideHint();
      }
    },
    onReset: () => {
      if (levelState.mode === 'play') {
        resetLevel();
      }
    },
    cat,
    cam
  });

  ui.onResetClick(() => {
    if (levelState.mode === 'play') {
      resetLevel();
    }
  });

  document.getElementById('editor-btn').addEventListener('click', () => {
    levelEditor.openEditor();
  });

  function doJump(dir, big) {
    if (levelState.mode !== 'play') return { hintShown };
    if (cat.state === 'slide' && !cat.onGround) {
      const away = -cat.slideSide;
      cat.vx = away * CONFIG.JUMP_VX * 1.2;
      cat.vy = -CONFIG.JUMP_VY;
      cat.facing = away;
      cat.state = 'air';
      cat.squash = 1.25;
      return { hintShown };
    }
    if (cat.state === 'hang') {
      if (dir === -cat.hangSide) {
        cat.state = 'air';
        cat.onGround = false;
        cat.hangPlat = null;
        cat.vy = -CONFIG.BIG_VY * 0.85;
        cat.vx = dir * CONFIG.JUMP_VX * 1.35;
        cat.facing = dir;
        cat.squash = 1.3;
        return { hintShown };
      }
      cat.y = cat.hangPlat.y;
      cat.x += cat.hangSide * 20;
      cat.vy = -420;
      cat.vx = 0;
      cat.state = 'air';
      cat.onGround = false;
      cat.hangPlat = null;
      return { hintShown };
    }
    if (!cat.onGround) return { hintShown };
    if (cat.landAge < 0.22) cat.combo = Math.min(cat.combo + 1, 3);
    else cat.combo = 0;
    const boost = 1 + 0.12 * cat.combo;
    cat.onGround = false;
    cat.state = 'air';
    cat.vy = -(big ? CONFIG.BIG_VY : CONFIG.JUMP_VY) * boost;
    cat.vx = dir * CONFIG.JUMP_VX;
    if (dir !== 0) cat.facing = dir;
    cat.squash = 1.25 + 0.05 * cat.combo;
    if (hintShown) {
      hintShown = false;
      ui.hideHint();
    }
    return { hintShown };
  }

  function tryTargetJump(wx, wy) {
    if (levelState.mode !== 'play' || !cat.onGround) return false;
    let best = null;
    for (const p of levelState.platforms) {
      if (Math.abs(p.y - wy) > 70) continue;
      const tx = Math.max(p.x + 14, Math.min(p.x + p.w - 14, wx));
      if (Math.abs(tx - wx) > 70) continue;
      if (p.y === cat.y && Math.abs(tx - cat.x) < 30) continue;
      const d = Math.hypot(tx - cat.x, p.y - cat.y);
      if (!best || d < best.d) best = { tx, ty: p.y, d };
    }
    if (!best) return false;
    const rise = Math.max(cat.y - best.ty, 0) + 40;
    const vy = -Math.sqrt(2 * CONFIG.GRAV * rise);
    if (-vy > CONFIG.BIG_VY * 1.2) return false;
    const disc = vy * vy + 2 * CONFIG.GRAV * (best.ty - cat.y);
    if (disc < 0) return false;
    const t = (-vy + Math.sqrt(disc)) / CONFIG.GRAV;
    const vx = (best.tx - cat.x) / t;
    if (Math.abs(vx) > 430) return false;
    cat.onGround = false;
    cat.state = 'air';
    cat.vy = vy;
    cat.vx = vx;
    if (Math.abs(vx) > 20) cat.facing = Math.sign(vx);
    cat.squash = 1.25;
    if (hintShown) {
      hintShown = false;
      ui.hideHint();
    }
    return true;
  }

  function doDrop() {
    if (levelState.mode !== 'play') return;
    if (cat.state === 'hang') {
      cat.state = 'air';
      cat.hangPlat = null;
      cat.vy = 100;
      return;
    }
    if (cat.onGround) {
      const p = levelState.platforms.find(p => cat.y === p.y);
      if (!p || p.kind === 'floor') return;
      cat.y += 3;
      cat.vy = 180;
      cat.onGround = false;
      cat.state = 'air';
      cat.squash = 1.15;
    } else {
      cat.vy += 500;
    }
  }

  function startLevel(idx) {
    levelState.level = idx;
    resetCat(cat);
    resetCamera(cam);
    loadLevel(levelState, levels[idx]);
    renderer.updatePalette(levelState.level, levels);
    ui.updateHUD(levelState.level, levels, levelState.memories, levelState.found);
    ui.resetHint();
    hintShown = true;
    levelState.mode = 'play';
  }

  function resetLevel() {
    startLevel(levelState.level);
  }

  function completeLevel() {
    if (levelState.level + 1 < levels.length) {
      levelState.level++;
      setTimeout(() => {
        startLevel(levelState.level);
        ui.showAct(levelState.level, levels, story);
      }, 1600);
    } else {
      setTimeout(() => {
        ui.showEnding(levelState.totalFound, levels, story);
      }, 1600);
    }
  }

  function showTitle() {
    levelState.mode = 'ui';
    ui.showTitle(story);
    setTimeout(() => {
      ui.elements.obtn.onclick = () => {
        ui.hideCard();
        showAct();
      };
    }, 100);
  }

  function showAct() {
    ui.showAct(levelState.level, levels, story);
    setTimeout(() => {
      ui.elements.obtn.onclick = () => {
        ui.hideCard();
        startLevel(levelState.level);
      };
    }, 100);
  }

  // Game loop
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    if (levelState.mode === 'play' && !levelState.levelDone) {
      // Check memory triggers
      const memoryTriggers = checkMemoryTriggers(cat, levelState, levelState.platforms);
      for (const id of memoryTriggers) {
        if (!levelState.found[id]) {
          levelState.found[id] = true;
          levelState.totalFound++;
          const m = levelState.memories.find(m => m.id === id);
          if (m) ui.showMemory(m.text);
          ui.updatePaws(levelState.memories, levelState.found);
        }
      }

      // Check knock trigger
      if (checkKnockTrigger(cat, levelState.knock)) {
        levelState.knock.falling = true;
        levelState.knock.vx = (levelState.knock.x > cat.x ? 1 : -1) * 120;
        levelState.knock.vy = -80;
      }

      // Physics
      physics.stepCat(cat, levelState.platforms, dt, levelState.mode);
      physics.stepKnock(levelState.knock, dt);
      physics.stepProps(levelState.yarn, levelState.books, levelState.bookShelfIdx, levelState.platforms, cat, dt);

      // Handle sneak movement
      const sneakDir = inputMgr.getSneakDir();
      if (cat.onGround && sneakDir !== 0) {
        cat.x += sneakDir * 115 * dt;
        cat.x = Math.max(cat.w/2, Math.min(CONFIG.WORLD_W - cat.w/2, cat.x));
        cat.facing = sneakDir;
        cat.state = 'sneak';
        const supported = levelState.platforms.some(p =>
          cat.y === p.y && cat.x + cat.w*0.35 > p.x && cat.x - cat.w*0.35 < p.x + p.w);
        if (!supported) { cat.onGround = false; cat.state = 'air'; }
      }

      // Check goal
      if (checkGoalTrigger(cat, levelState.platforms, levels[levelState.level].goalKind)) {
        const goalMemory = levelState.memories.find(m => m.trigger === 'goal');
        if (goalMemory && !levelState.found[goalMemory.id]) {
          levelState.found[goalMemory.id] = true;
          levelState.totalFound++;
          ui.showMemory(goalMemory.text);
          ui.updatePaws(levelState.memories, levelState.found);
        }
        levelState.levelDone = true;
        completeLevel();
      }

      physics.stepCam(cam, cat, W, H);
    } else if (levelState.mode === 'ui') {
      cat.tailT += dt;
    }

    // Render
    renderer.drawBackground(levelState.level, levels, cat, cam);
    ctx.save();
    ctx.scale(cam.scale, cam.scale);
    ctx.translate(-cam.x, -cam.y);

    for (const p of levelState.platforms) renderer.drawPlatform(p);
    const topShelf = levelState.platforms.find(p => p.kind === 'top');
    if (topShelf) renderer.drawPlant(topShelf.x + topShelf.w - 55, topShelf.y);
    renderer.drawKnock(levelState.knock);
    renderer.drawProps(levelState.yarn, levelState.books, levelState.bookShelfIdx, levelState.platforms);
    renderer.drawCat(cat);

    ctx.restore();

    // Render editor overlay if active
    if (levelEditor.isEditing()) {
      ctx.save();
      ctx.scale(1 / cam.scale, 1 / cam.scale);
      levelEditor.render();
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  // Start game
  loadLevel(levelState, levels[0]);
  renderer.updatePalette(0, levels);
  ui.updateHUD(0, levels, levelState.memories, levelState.found);
  ui.setHintText(story?.ui?.hint ?? 'Desliza ↑ ↖ ↗ para saltar (largo = supersalto) · ↓ para bajar<br>Toca un mueble para saltar hacia él · arrastra al lado = sigiloso');
  showTitle();
  requestAnimationFrame(frame);

  // Expose globals for testing/debugging
  window.CONFIG = CONFIG;
  window.cat = cat;
  window.cam = cam;
  window.levelState = levelState;
  window.levels = levels;
  window.story = story;

  // Service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

main().catch(console.error);
</script>
</body>
</html>
