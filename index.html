<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11131a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nero">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <title>Nero · una historia de gato</title>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hud-pill">Acto <strong id="scene-name">Nero</strong></div>
      <div class="hud-pill">Recuerdos <strong id="memory-count">0/0</strong></div>
    </div>

    <div id="bottom-bar">
      <div class="control-pad">
        <button class="control-btn" data-action="left" aria-label="Mover a la izquierda">◀</button>
        <button class="control-btn" data-action="jump" aria-label="Saltar">⤴</button>
        <button class="control-btn" data-action="right" aria-label="Mover a la derecha">▶</button>
      </div>
      <div class="control-pad">
        <button class="control-btn" id="restart-btn" aria-label="Reiniciar">↺</button>
      </div>
    </div>

    <div id="toast">Bienvenido a la casa</div>

    <div id="overlay" class="hidden">
      <div class="card">
        <div class="eyebrow">Nero</div>
        <h1 id="overlay-title">Nero</h1>
        <div id="overlay-body"></div>
        <div class="actions">
          <button class="primary-btn" id="overlay-button">Continuar</button>
          <button class="ghost-btn" id="overlay-secondary" style="display:none">Cerrar</button>
        </div>
      </div>
    </div>

    <div id="install-banner">
      <div class="card">
        <div class="eyebrow">Instalar app</div>
        <p>Guarda Nero en tu pantalla de inicio y vive la historia como una app.</p>
        <div class="actions">
          <button class="primary-btn" id="install-button">Instalar</button>
          <button class="ghost-btn" id="install-dismiss">Después</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createGameEngine } from './js/engine.js';

    const canvas = document.getElementById('game');

    async function loadJson(file) {
      const response = await fetch(file, { cache: 'no-store' });
      if (!response.ok) throw new Error(`No se pudo cargar ${file}`);
      return response.json();
    }

    async function boot() {
      const [scenes, stories] = await Promise.all([
        loadJson('./data/scenes.json'),
        loadJson('./data/stories.json')
      ]);

      const engine = createGameEngine({ canvas, scenes, stories });
      engine.start();
    }

    boot().catch((error) => {
      console.error(error);
      document.getElementById('toast').textContent = 'No se pudo iniciar Nero.';
      document.getElementById('toast').classList.add('show');
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
