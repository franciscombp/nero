<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nero 3D · una historia de gato</title>
<link rel="stylesheet" href="styles/main.css">
<style>
  /* el cronómetro del callejón no debe pisar los pills del HUD */
  #level-timer { top: 64px !important; }
</style>
<meta name="theme-color" content="#F4ECE3">
<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="pill" id="acto">—</div>
  <div class="pill" id="paws"></div>
  <a class="pill" id="modeswap" href="index.html" title="Versión 2D">2D</a>
  <div class="pill" id="reset">↺</div>
</div>
<div id="memory"></div>
<div id="hint"></div>
<div id="overlay"><div id="ocard">
  <div class="catface" id="oface">🐈‍⬛</div>
  <div class="kicker" id="okicker"></div>
  <h1 id="otitle"></h1>
  <h2 id="osub"></h2>
  <p id="otext"></p>
  <button id="obtn"></button>
</div></div>

<script type="module">
// Nero en el motor 3D: mismo contenido y mecánicas que el juego 2D (data/scenes.json),
// renderizado como diorama 2.5D. La lógica de gameplay replica index.html.
import { CONFIG, createCat, createLevelState, loadLevel, resetCat, createPushable, checkMemoryTriggers, checkKnockTrigger, checkGoalTrigger, checkPuzzleCondition } from './js/core.js';
import { createPhysics } from './js/physics.js';
import { createUI } from './js/ui.js';
import { createRenderer3D } from './js/renderer3d.js';
import { doJump as jumpAction, tryTargetJump as targetJumpAction, doDrop as dropAction, applySneak } from './js/actions.js';

async function main() {
  const canvas = document.getElementById('game');

  // Datos: los mismos del juego 2D — con soporte de borrador del editor (?draft=1)
  const useDraft = new URLSearchParams(location.search).has('draft');
  const draftScenes = useDraft ? localStorage.getItem('nero-draft-scenes') : null;
  const draftStory = useDraft ? localStorage.getItem('nero-draft-stories') : null;
  const [levelsRes, storiesRes] = await Promise.all([
    fetch('data/scenes.json'),
    fetch('data/stories.json')
  ]);
  const levels = draftScenes ? JSON.parse(draftScenes) : await levelsRes.json();
  const story = draftStory ? JSON.parse(draftStory) : await storiesRes.json();

  const physics = createPhysics(CONFIG);
  const ui = createUI();
  const cat = createCat();
  const levelState = createLevelState();
  const r3d = createRenderer3D(canvas);

  let W = window.innerWidth, H = window.innerHeight;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    r3d.resize(W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  // Cinemáticas de la historia de origen (mismas que el 2D)
  const cinematics = {
    2: {
      text: `Nero no logró subirse a tiempo. Resbala. Cae.<br><br>Una sombra enorme lo cubre.<br>Una voz profunda dice: "¿Qué haces aquí, pequeño?"<br><br>Manos suaves lo levantan.<br>Nero está asustado pero... seguro.`,
      duration: 4000
    },
    5: {
      text: `<b>Un nuevo amanecer.</b><br><br>El dueño prepara café.<br>Nero baja del sofá, estirándose.<br><br>La cocina es la misma que ayer.<br>Pero Nero es diferente. El dueño es diferente.<br><br><b>La aventura verdadera comienza.</b>`,
      duration: 5000
    }
  };

  // Rama A (llegó al camión) vs Rama B (lo recogió el conductor)
  function recordBranch(branchId) {
    try {
      const data = JSON.parse(localStorage.getItem('nero_branches') || '{}');
      data.origin = branchId;
      data.timestamp = new Date().toISOString();
      localStorage.setItem('nero_branches', JSON.stringify(data));
    } catch (e) { /* almacenamiento no disponible */ }
  }

  const curLevel = () => levels[levelState.level];

  function getMovementMods() {
    const L = curLevel();
    if (!L?.mechanics?.babyKitten) return { speed: 1, jump: 1 };
    return { speed: L.mechanics.speed || 0.7, jump: L.mechanics.jumpHeight || 0.8 };
  }

  let hintShown = true;
  function hideHintOnce() {
    if (hintShown) { hintShown = false; ui.hideHint(); }
  }

  function doJump(dir, big) {
    if (levelState.mode !== 'play') return;
    const L = curLevel();
    // Nivel de la caja: cada salto desde el suelo cuenta y sacude la caja
    if (L?.goalKind === 'jumps_counted' && cat.onGround) {
      levelState.jumpCount++;
      levelState.lastJumpDir = dir;
      levelState.boxAnimT = 0.001;
    }
    if (jumpAction(cat, dir, big, getMovementMods())) hideHintOnce();
  }
  function doDrop() {
    if (levelState.mode !== 'play') return;
    dropAction(cat, levelState.platforms);
  }

  // ---------- Input (mismos gestos que el 2D; el tap se proyecta al plano de juego) ----------
  let pressT = null, pressZone = 0, pressStart = null, sneakTouch = 0;
  const pointers = new Set();
  const held = { l: false, r: false, shift: false };
  const sneakDir = () => sneakTouch || (held.shift ? (held.r ? 1 : 0) - (held.l ? 1 : 0) : 0);

  canvas.addEventListener('pointerdown', e => {
    pointers.add(e.pointerId);
    if (pointers.size >= 2) { doJump(pressZone, true); pressT = null; return; }
    pressZone = e.clientX < W / 3 ? -1 : (e.clientX > 2 * W / 3 ? 1 : 0);
    pressT = performance.now();
    pressStart = { x: e.clientX, y: e.clientY };
    if (levelState.mode === 'play' && cat.onGround && cat.state !== 'hang') {
      cat.state = 'charge'; cat.squash = 0.8;
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (!pressStart || pointers.size !== 1) return;
    const dx = e.clientX - pressStart.x, dy = e.clientY - pressStart.y;
    if (Math.abs(dx) > 22 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      sneakTouch = Math.sign(dx);
      pressT = null;
      hideHintOnce();
    }
  });
  function releasePointer(e) {
    pointers.delete(e.pointerId);
    const start = pressStart;
    if (pointers.size === 0) { sneakTouch = 0; pressStart = null; }
    if (pressT === null) return;
    const heldMs = performance.now() - pressT;
    pressT = null;
    if (start && e.clientX !== undefined) {
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (dy < -30) {
        const dir = dx > 36 ? 1 : dx < -36 ? -1 : 0;
        const big = -dy > 130 || (heldMs < 180 && -dy > 70);
        doJump(dir, big);
        return;
      }
      if (dy > 30 && Math.abs(dy) > Math.abs(dx)) { doDrop(); return; }
    }
    const { wx, wy } = r3d.screenToWorld(e.clientX, e.clientY);
    if (levelState.mode === 'play' && curLevel()?.goalKind !== 'jumps_counted' &&
        targetJumpAction(cat, levelState.platforms, wx, wy)) {
      hideHintOnce();
    } else {
      const dir = Math.abs(wx - cat.x) > 40 ? Math.sign(wx - cat.x) : 0;
      doJump(dir, heldMs > 350);
    }
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);

  window.addEventListener('keydown', e => {
    if (e.key === 'Shift') held.shift = true;
    if (e.key === 'ArrowLeft') held.l = true;
    if (e.key === 'ArrowRight') held.r = true;
    if (e.repeat) return;
    if (e.key === 'ArrowLeft') { if (!e.shiftKey) doJump(-1, false); }
    else if (e.key === 'ArrowRight') { if (!e.shiftKey) doJump(1, false); }
    else if (e.key === 'ArrowUp' || e.key === ' ') doJump(0, e.shiftKey);
    else if (e.key === 'ArrowDown') doDrop();
    else if (e.key === 'r' || e.key === 'R') { if (levelState.mode === 'play') resetLevel(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'Shift') held.shift = false;
    if (e.key === 'ArrowLeft') held.l = false;
    if (e.key === 'ArrowRight') held.r = false;
  });
  ui.onResetClick(() => { if (levelState.mode === 'play') resetLevel(); });

  // ---------- Flujo de niveles ----------
  function startLevel(idx) {
    levelState.level = idx;
    resetCat(cat);
    loadLevel(levelState, levels[idx]);

    const L = levels[idx];
    levelState.pushables = (L.pushables || []).map(p => createPushable(p));
    levelState.puzzles = L.puzzles || [];
    levelState.puzzleSolved = {};
    levelState.boxTiltAngle = 0;
    levelState.boxAnimT = 0;
    levelState.lastJumpDir = 0;

    r3d.loadScene(L, levelState);
    r3d.setCatVisible(L.goalKind !== 'jumps_counted');   // en la caja, Nero va escondido
    ui.updateHUD(idx, levels, levelState.memories, levelState.found, levelState.puzzles, levelState.puzzleSolved);
    ui.resetHint();
    hintShown = true;
  }

  // Efectos que solo deben dispararse al empezar a JUGAR el nivel (no con la tarjeta abierta)
  function enterPlay() {
    levelState.mode = 'play';
    const L = curLevel();

    // recuerdos con disparador de inicio
    setTimeout(() => {
      if (levelState.mode !== 'play') return;
      for (const m of levelState.memories) if (m.trigger === 'start') collect(m.id);
    }, 800);

    // niveles solo-cinemática: se cuentan solos
    if (L?.mechanics?.cinematicOnly) {
      const cin = cinematics[levelState.level];
      levelState.levelDone = true;   // sin gameplay
      ui.showCinematic(cin?.text ?? L.intro, cin?.duration ?? 4000);
      setTimeout(() => {
        const gm = levelState.memories.find(m => m.trigger === 'goal');
        if (gm) collect(gm.id);
        completeLevel();
      }, (cin?.duration ?? 4000) + 300);
      return;
    }

    // reto contrarreloj del callejón: al agotarse, Nero no llega al camión → Rama B
    if (L?.mechanics?.timerChallenge) {
      ui.startLevelTimer(L.mechanics.timerChallenge, () => {
        if (levelState.levelDone) return;
        recordBranch('branch_b');
        levelState.levelDone = true;
        setTimeout(() => completeLevel(2), 900);   // nivel 2 = cinemática de la Rama B
      });
    }
  }

  function resetLevel() {
    ui.stopLevelTimer();
    startLevel(levelState.level);
    enterPlay();
  }

  function completeLevel(target) {
    ui.stopLevelTimer();
    const next = target ?? levelState.level + 1;
    if (next < levels.length) {
      levelState.level = next;
      setTimeout(showAct, 1400);
    } else {
      const total = levels.reduce((sum, s) => sum + s.memories.length, 0);
      setTimeout(() => ui.showCard({
        face: '🌙', kicker: 'fin', sub: 'La casa llena',
        text: `${story?.ui?.final ?? 'La casa nunca estuvo vacía: estaba llena de ellos.'}<br><br>🐾 Recuerdos encontrados: <b>${levelState.totalFound} / ${total}</b>`,
        btn: 'Jugar otra vez',
        then: () => { levelState.totalFound = 0; levelState.level = 0; showAct(); }
      }), 1400);
    }
  }

  function showTitle() {
    levelState.mode = 'ui';
    ui.showCard({
      kicker: story?.title?.kicker ?? 'una historia de gato',
      title: story?.title?.title ?? 'N E R O',
      text: story?.title?.body ?? '',
      btn: 'Empezar',
      then: showAct
    });
  }

  function showAct() {
    levelState.mode = 'ui';
    startLevel(levelState.level);
    const L = curLevel();
    ui.showCard({
      kicker: L.kicker, sub: L.name, text: L.intro, btn: 'Jugar',
      then: enterPlay
    });
  }

  function collect(id) {
    if (levelState.found[id]) return;
    levelState.found[id] = true;
    levelState.totalFound++;
    const m = levelState.memories.find(m => m.id === id);
    if (m) ui.showMemory(m.text);
    ui.updatePaws(levelState.memories, levelState.found);
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    const L = curLevel();

    if (levelState.mode === 'play' && !levelState.levelDone) {
      for (const id of checkMemoryTriggers(cat, levelState, levelState.platforms)) collect(id);

      if (checkKnockTrigger(cat, levelState.knock)) {
        levelState.knock.falling = true;
        levelState.knock.vx = (levelState.knock.x > cat.x ? 1 : -1) * 120;
        levelState.knock.vy = -80;
      }

      physics.stepCat(cat, levelState.platforms, dt, levelState.mode, L, levelState.pushables);
      physics.stepKnock(levelState.knock, dt);
      physics.stepProps(levelState.yarn, levelState.books, levelState.bookShelfIdx, levelState.platforms, cat, dt);
      if (levelState.pushables.length) {
        physics.stepPushables(levelState.pushables, cat, levelState.platforms, dt, L);
      }
      applySneak(cat, levelState.platforms, sneakDir(), dt, getMovementMods().speed);

      const kn = levelState.knock;
      if (kn && kn.broken && kn.memoryId) collect(kn.memoryId);

      // animación de vaivén de la caja (portada del 2D)
      if (L?.goalKind === 'jumps_counted') {
        const requiredJumps = L.goalParams?.requiredJumps || 8;
        if (levelState.jumpCount >= requiredJumps) {
          const dirSign = levelState.lastJumpDir === 0 ? 1 : Math.sign(levelState.lastJumpDir);
          levelState.boxTiltAngle = (Math.PI / 2) * dirSign;
        } else if (levelState.boxAnimT > 0 && levelState.boxAnimT < 1) {
          levelState.boxAnimT += dt / levelState.boxAnimDuration;
          const t = Math.min(levelState.boxAnimT, 1);
          const dirSign = levelState.lastJumpDir === 0 ? 1 : Math.sign(levelState.lastJumpDir);
          const maxTilt = (levelState.jumpCount / requiredJumps) * (Math.PI / 2);
          let eased;
          if (t < 0.4) {
            const swingT = t / 0.4;
            eased = 1 - Math.pow(1 - swingT, 3);
          } else {
            const returnT = (t - 0.4) / 0.6;
            eased = 1 - Math.pow(1 - returnT, 2);
          }
          levelState.boxTiltAngle = maxTilt * dirSign * eased;
          if (t >= 1) { levelState.boxTiltAngle = 0; levelState.boxAnimT = 0; }
        } else {
          levelState.boxTiltAngle = 0;
        }
      }

      // puzzles
      for (const puzzle of levelState.puzzles) {
        if (!levelState.puzzleSolved[puzzle.id] && checkPuzzleCondition(puzzle, levelState)) {
          levelState.puzzleSolved[puzzle.id] = true;
          ui.updateHUD(levelState.level, levels, levelState.memories, levelState.found, levelState.puzzles, levelState.puzzleSolved);
        }
      }

      // meta
      if (checkGoalTrigger(cat, levelState.platforms, L.goalKind, levelState)) {
        levelState.levelCompleteTime = now;
        const gm = levelState.memories.find(m => m.trigger === 'goal');
        if (gm) collect(gm.id);

        let target;
        if (levelState.level === 1 && L.mechanics?.branchId === 'branch_a') {
          recordBranch('branch_a');
          target = 3;   // llegó al camión: la Rama B (cinemática de rescate) no ocurre
        }
        if (L.goalKind === 'jumps_counted') {
          // escape de la caja: la caja queda volcada y Nero aparece junto a ella
          const box = levelState.pushables[0];
          if (box) {
            cat.x = Math.max(cat.w / 2, box.x - 40);
            cat.y = CONFIG.FLOOR_Y;
            cat.vx = 0; cat.vy = 0; cat.onGround = true; cat.state = 'idle';
            cat.facing = 1;
          }
          r3d.setCatVisible(true);
        }
        levelState.levelDone = true;
        setTimeout(() => completeLevel(target), 1500);
      }
    } else {
      cat.tailT += dt;
    }

    const isBoxLevel = L?.goalKind === 'jumps_counted';
    const box = isBoxLevel ? levelState.pushables[0] : null;
    r3d.update(dt, {
      cat,
      knock: levelState.knock,
      yarn: levelState.yarn,
      books: levelState.books,
      bookShelfIdx: levelState.bookShelfIdx,
      platforms: levelState.platforms,
      pushables: levelState.pushables,
      boxTilt: levelState.boxTiltAngle,
      jumpCounter: isBoxLevel ? {
        count: levelState.jumpCount,
        required: L.goalParams?.requiredJumps || 8,
        complete: levelState.jumpCount >= (L.goalParams?.requiredJumps || 8)
      } : null,
      focus: box ? { x: box.x + box.w / 2, y: box.y + box.h / 2 } : null
    });
    r3d.render();
    requestAnimationFrame(frame);
  }

  startLevel(0);
  ui.setHintText(story?.ui?.hint ?? 'Desliza ↑ para saltar · toca un mueble para saltar hacia él');
  showTitle();
  requestAnimationFrame(frame);

  // Globals para testing/debug
  window.CONFIG = CONFIG;
  window.cat = cat;
  window.levelState = levelState;
  window.levels = levels;
  window.__enterPlay = enterPlay;
}

main().catch(err => {
  console.error(err);
  document.body.insertAdjacentHTML('beforeend',
    `<div style="position:fixed;inset:auto 10px 10px;background:#FBF6EE;border-radius:12px;padding:12px;color:#4A4139;font-size:13px">Error al cargar Nero 3D: ${err.message}</div>`);
});
</script>
</body>
</html>
